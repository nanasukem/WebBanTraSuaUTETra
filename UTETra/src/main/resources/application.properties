spring.config.import=optional:file:.env[.properties]
spring.application.name=UTETra

server.port=${SERVER_PORT:8080}

# ===== DATABASE =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=${SHOW_SQL:true}

# ===== EMAIL GỬI OTP =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== JWT =====
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION:3600000}

# ===== CLOUDINARY =====
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== UPLOAD (ảnh/video đánh giá, ảnh đại diện) =====
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=160MB

# ===== THANH TOÁN ONLINE (sandbox) =====
# Địa chỉ web (VNPAY / MoMo đưa khách quay lại đây sau khi trả tiền)
app.base-url=${APP_BASE_URL:http://localhost:${SERVER_PORT:8080}}
# Địa chỉ public để cổng gọi IPN (vd https://xxxx.ngrok-free.app). Bỏ trống: web tự hỏi lại cổng mỗi phút
payment.ipn-base-url=${PAYMENT_IPN_BASE_URL:}
# Số phút giữ đơn chờ thanh toán, quá hạn hệ thống tự huỷ
payment.timeout-minutes=${PAYMENT_TIMEOUT_MINUTES:15}
# VNPAY sandbox: đăng ký miễn phí tại https://sandbox.vnpayment.vn/devreg/ (để trống = chế độ demo)
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
