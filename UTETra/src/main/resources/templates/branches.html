<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/user-layout :: main('Chi nhánh - UTETra', ~{::#branches-content})}">

<body>
	<div id="branches-content">

		<section class="bg-white rounded-4 shadow-sm p-4 mb-4">
			<div
				class="d-flex flex-wrap justify-content-between align-items-center gap-3">
				<div>
					<span class="badge bg-success mb-2">UTETra</span>
					<h1 class="fw-bold text-success mb-1">Chi nhánh</h1>
					<p class="text-muted mb-0">
						<strong th:text="${#lists.size(branches)}">2</strong> chi nhánh
						đang hoạt động · cùng một thực đơn, đặt món online và giao tận
						nơi.
					</p>
				</div>
				<button type="button" id="btnNearest"
					class="btn btn-outline-success">
					<i class="bi bi-geo-alt me-1"></i> Gần tôi nhất
				</button>
			</div>
			<p id="geoMsg" class="small text-muted mt-2 mb-0 d-none"></p>
		</section>

		<div class="row g-4" id="branchList"
			th:unless="${#lists.isEmpty(branches)}">
			<div class="col-12 col-md-6 col-lg-4 branch-item"
				th:each="b : ${branches}"
				th:attr="data-lat=${b.latitude}, data-lng=${b.longitude}">
				<div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden branch-card">

					<div class="bg-success-subtle position-relative branch-cover" style="height: 160px;">
						<img
							th:if="${b.imageCloudinaryId != null and !#strings.isEmpty(b.imageCloudinaryId)}"
							th:src="${b.imageCloudinaryId}" th:alt="${b.name}"
							class="w-100 h-100" style="object-fit: cover;" loading="lazy">
						<div
							th:unless="${b.imageCloudinaryId != null and !#strings.isEmpty(b.imageCloudinaryId)}"
							class="w-100 h-100 d-flex justify-content-center align-items-center text-success">
							<i class="bi bi-shop" style="font-size: 3.5rem;"></i>
						</div>
						<span class="badge bg-success position-absolute top-0 start-0 m-2">
							<i class="bi bi-circle-fill me-1" style="font-size: .5rem;"></i>
							Đang hoạt động
						</span> <span
							class="badge bg-dark bg-opacity-75 position-absolute top-0 end-0 m-2 d-none branch-distance"></span>
					</div>

					<div class="card-body d-flex flex-column">
						<div class="d-flex justify-content-between align-items-center gap-2 mb-2">
							<h2 class="h5 fw-bold mb-0"><a th:href="@{/branches/{id}(id=${b.id})}"
								class="text-reset text-decoration-none stretched-link" th:text="${b.name}">UTETra Võ Văn Ngân</a></h2>
							<span class="badge bg-warning text-dark px-2 py-1 fw-bold flex-shrink-0"
								th:if="${branchReviewSummaries != null and branchReviewSummaries[b.id] != null}">
								⭐ <span th:text="${branchReviewSummaries[b.id]['avgRating']}">4.7</span>/5
								<small class="fw-normal" th:text="|(${branchReviewSummaries[b.id]['totalReviews']})|">(3)</small>
							</span>
						</div>
						<p class="mb-2">
							<i class="bi bi-geo-alt text-danger me-1"></i><span
								th:text="${b.address}">Địa chỉ</span>
						</p>
						<p class="mb-2" th:with="mo=${b.isOpenAt(now)}">
							<i class="bi bi-clock me-1"
								th:classappend="${mo} ? 'text-success' : 'text-secondary'"></i>
							<span th:text="${b.hoursLabel}">7:00 - 22:00</span> · <span
								class="fw-semibold"
								th:classappend="${mo} ? 'text-success' : 'text-danger'"
								th:text="${b.openStatusAt(now)}">Đang mở cửa</span>
						</p>
						<p class="mb-2"
							th:if="${b.phone != null and !#strings.isEmpty(b.phone)}">
							<i class="bi bi-telephone text-success me-1"></i> <a
								th:href="'tel:' + ${b.phone}" class="link-success branch-inner-link"
								th:text="${b.phone}">028</a>
						</p>
						<p class="text-muted small mb-3"
							th:if="${b.description != null and !#strings.isEmpty(b.description)}"
							th:text="${b.description}">Mô tả</p>

						<div class="mt-auto d-flex flex-wrap gap-2 branch-inner-link">
							<a th:href="@{/menu}" class="btn btn-success btn-sm"> <i
								class="bi bi-house-door me-1"></i> Xem thực đơn
							</a>
							<a th:if="${b.latitude != null and b.longitude != null}"
								target="_blank" rel="noopener"
								th:href="|https://www.google.com/maps/dir/?api=1&destination=${b.latitude},${b.longitude}|"
								class="btn btn-outline-success btn-sm"><i
								class="bi bi-sign-turn-right me-1"></i> Chỉ đường</a> <a
								th:if="${b.latitude == null or b.longitude == null}"
								target="_blank" rel="noopener"
								th:href="'https://www.google.com/maps/search/?api=1&query=' + ${#uris.escapeQueryParam(b.address)}"
								class="btn btn-outline-success btn-sm"><i
								class="bi bi-map me-1"></i> Xem bản đồ</a>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div class="card border-0 shadow-sm rounded-4"
			th:if="${#lists.isEmpty(branches)}">
			<div class="card-body text-center py-5">
				<i class="bi bi-shop text-success" style="font-size: 3rem;"></i>
				<h3 class="h5 mt-3">Chưa có chi nhánh nào đang hoạt động</h3>
			</div>
		</div>

		<style>
	.branch-card { transition: transform .2s, box-shadow .2s; cursor: pointer; }
	.branch-card:hover { transform: translateY(-4px); box-shadow: 0 .75rem 1.5rem rgba(0,0,0,.12) !important; }
	.branch-card:hover h2 { color: var(--bs-success); }
	.branch-cover { overflow: hidden; }
	.branch-cover img { transition: transform .3s; }
	.branch-card:hover .branch-cover img { transform: scale(1.05); }
	.branch-inner-link { position: relative; z-index: 2; }
</style>
		<script>
			(function () {
				const btn = document.getElementById('btnNearest');
				const msg = document.getElementById('geoMsg');
				const list = document.getElementById('branchList');
				if (!btn || !list) return;

				function km(lat1, lon1, lat2, lon2) {
					const R = 6371, toRad = (d) => d * Math.PI / 180;
					const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
					const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
					return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
				}

				btn.addEventListener('click', function () {
					if (!navigator.geolocation) {
						msg.textContent = 'Trình duyệt không hỗ trợ lấy vị trí.';
						msg.classList.remove('d-none');
						return;
					}
					btn.disabled = true;
					msg.textContent = 'Đang lấy vị trí của bạn...';
					msg.classList.remove('d-none');

					navigator.geolocation.getCurrentPosition(function (pos) {
						const items = Array.from(list.querySelectorAll('.branch-item'));
						items.forEach(function (el) {
							const lat = parseFloat(el.dataset.lat), lng = parseFloat(el.dataset.lng);
							if (!isNaN(lat) && !isNaN(lng)) {
								const d = km(pos.coords.latitude, pos.coords.longitude, lat, lng);
								el.dataset.dist = d;
								const badge = el.querySelector('.branch-distance');
								badge.textContent = d.toFixed(1) + ' km';
								badge.classList.remove('d-none');
							} else {
								el.dataset.dist = 999999;
							}
						});
						items.sort((a, b) => parseFloat(a.dataset.dist) - parseFloat(b.dataset.dist));
						items.forEach((el) => list.appendChild(el));
						msg.textContent = 'Đã sắp xếp chi nhánh từ gần đến xa vị trí của bạn.';
						btn.disabled = false;
					}, function () {
						msg.textContent = 'Không lấy được vị trí (bạn đã từ chối hoặc trình duyệt chặn).';
						btn.disabled = false;
					});
				});
			})();
		</script>

	</div>
</body>
</html>
