
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/admin-layout :: main('Quản lý nhà vận chuyển', 'carriers', ~{::#admin-content})}">

<section id="admin-content">
	<div class="container-fluid py-3">

		<div
			class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
			<div>
				<h2 class="fw-bold mb-1">Quản lý nhà vận chuyển</h2>
				<p class="text-muted mb-0">Quản lý đơn vị giao hàng và phí vận
					chuyển mặc định.</p>
			</div>

			<a th:href="@{/admin/carriers/new}" class="btn btn-primary"> <i
				class="bi bi-plus-lg"></i> Thêm nhà vận chuyển
			</a>
		</div>

		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<div class="row g-3 mb-4">
			<div class="col-12 col-md-6">
				<div class="card border-0 shadow-sm">
					<div class="card-body">
						<div class="text-muted small">Tổng nhà vận chuyển</div>
						<div class="fs-3 fw-bold" th:text="${totalCarriers}">0</div>
					</div>
				</div>
			</div>

			<div class="col-12 col-md-6">
				<div class="card border-0 shadow-sm">
					<div class="card-body">
						<div class="text-muted small">Đang hoạt động</div>
						<div class="fs-3 fw-bold text-success" th:text="${activeCarriers}">0</div>
					</div>
				</div>
			</div>
		</div>

		<div class="card border-0 shadow-sm mb-4">
			<div class="card-body">
				<form method="get" th:action="@{/admin/carriers}">
					<div class="row g-3 align-items-end">
						<div class="col-12 col-md-6">
							<label for="keyword" class="form-label">Tên nhà vận
								chuyển</label> <input id="keyword" name="keyword" class="form-control"
								placeholder="Nhập tên cần tìm..." th:value="${keyword}">
						</div>

						<div class="col-12 col-md-4">
							<label for="status" class="form-label">Trạng thái</label> <select
								id="status" name="status" class="form-select">
								<option value="ALL" th:selected="${selectedStatus == 'ALL'}">Tất
									cả</option>
								<option value="ACTIVE"
									th:selected="${selectedStatus == 'ACTIVE'}">Đang hoạt
									động</option>
								<option value="INACTIVE"
									th:selected="${selectedStatus == 'INACTIVE'}">Đã tắt</option>
							</select>
						</div>

						<div class="col-12 col-md-2 d-flex gap-2">
							<button class="btn btn-primary flex-grow-1" type="submit">
								<i class="bi bi-search"></i> Tìm
							</button>
							<a th:href="@{/admin/carriers}" class="btn btn-outline-secondary"
								title="Xóa bộ lọc"> <i class="bi bi-arrow-counterclockwise"></i>
							</a>
						</div>
					</div>
				</form>
			</div>
		</div>

		<div class="card border-0 shadow-sm">
			<div class="card-header bg-white py-3 fw-semibold">Danh sách
				nhà vận chuyển</div>

			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th class="ps-3">ID</th>
							<th>Tên nhà vận chuyển</th>
							<th class="text-end">Phí vận chuyển</th>
							<th>Trạng thái</th>
							<th class="text-center">Thao tác</th>
						</tr>
					</thead>

					<tbody>
						<tr th:each="c : ${carriers}">
							<td class="ps-3" th:text="${c.id}">1</td>
							<td class="fw-semibold" th:text="${c.name}">Đơn vị giao hàng</td>
							<td class="text-end"
								th:text="${#numbers.formatDecimal(c.fee, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
								15.000 ₫</td>
							<td><span th:if="${c.isActive}" class="badge bg-success">Hoạt
									động</span> <span th:unless="${c.isActive}" class="badge bg-secondary">Đã
									tắt</span></td>
							<td class="text-center">
								<div class="d-inline-flex gap-1">
									<a th:href="@{/admin/carriers/{id}/edit(id=${c.id})}"
										class="btn btn-sm btn-outline-primary" title="Chỉnh sửa">
										<i class="bi bi-pencil"></i>
									</a>

									<form th:action="@{/admin/carriers/{id}/toggle(id=${c.id})}"
										method="post"
										onsubmit="return confirm('Bạn có chắc muốn đổi trạng thái nhà vận chuyển này?');">
										<button type="submit" class="btn btn-sm"
											th:classappend="${c.isActive} ? ' btn-outline-danger' : ' btn-outline-success'"
											th:title="${c.isActive} ? 'Tắt hoạt động' : 'Bật hoạt động'">
											<i
												th:class="${c.isActive} ? 'bi bi-toggle-on' : 'bi bi-toggle-off'"></i>
										</button>
									</form>
								</div>
							</td>
						</tr>

						<tr th:if="${#lists.isEmpty(carriers)}">
							<td colspan="5" class="text-center text-muted py-5">Chưa có
								nhà vận chuyển phù hợp.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</div>
</section>
</html>
