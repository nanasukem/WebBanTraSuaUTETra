<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhà vận chuyển - UTETra</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container py-4">

		<div class="d-flex justify-content-between align-items-center mb-3">
			<h3 class="mb-0">
				<i class="bi bi-truck"></i> Quản lý nhà vận chuyển
			</h3>
			<a th:href="@{/admin/carriers/create}" class="btn btn-success"><i
				class="bi bi-plus-lg"></i> Thêm nhà vận chuyển</a>
		</div>

		<div th:if="${success}"
			class="alert alert-success alert-dismissible fade show">
			<span th:text="${success}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<form th:action="@{/admin/carriers}" method="get"
			class="card card-body mb-3">
			<div class="row g-2">
				<div class="col-md-9">
					<input type="text" name="keyword" th:value="${keyword}"
						class="form-control" placeholder="Tìm theo tên nhà vận chuyển...">
				</div>
				<div class="col-md-3 d-flex gap-2">
					<button type="submit" class="btn btn-primary flex-fill">
						<i class="bi bi-search"></i> Tìm
					</button>
					<a th:href="@{/admin/carriers}" class="btn btn-outline-secondary">Xóa
						lọc</a>
				</div>
			</div>
		</form>

		<div class="card">
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th>#</th>
							<th>Tên nhà vận chuyển</th>
							<th class="text-end">Phí vận chuyển</th>
							<th>Trạng thái</th>
							<th class="text-end">Thao tác</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(carriers)}">
							<td colspan="5" class="text-center text-muted py-4">Chưa có
								nhà vận chuyển nào</td>
						</tr>
						<tr th:each="c : ${carriers}">
							<td th:text="${c.id}"></td>
							<td class="fw-semibold" th:text="${c.name}"></td>
							<td class="text-end"
								th:text="${#numbers.formatDecimal(c.fee, 1, 'POINT', 0, 'COMMA')} + ' đ'"></td>
							<td><span th:if="${c.isActive}"
								class="badge text-bg-success">Đang hoạt động</span> <span
								th:unless="${c.isActive}" class="badge text-bg-secondary">Đã
									tắt</span></td>
							<td class="text-end text-nowrap"><a
								th:href="@{/admin/carriers/{id}/edit(id=${c.id})}"
								class="btn btn-sm btn-outline-primary" title="Sửa"> <i
									class="bi bi-pencil"></i>
							</a>
								<form th:action="@{/admin/carriers/{id}/toggle(id=${c.id})}"
									method="post" class="d-inline">
									<button th:if="${c.isActive}"
										class="btn btn-sm btn-outline-secondary" title="Tắt"
										onclick="return confirm('Tắt nhà vận chuyển này? Khách sẽ không chọn được nữa.')">
										<i class="bi bi-pause-fill"></i>
									</button>
									<button th:unless="${c.isActive}"
										class="btn btn-sm btn-outline-success" title="Bật">
										<i class="bi bi-play-fill"></i>
									</button>
								</form></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
