
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/admin-layout :: main('Thông tin nhà vận chuyển', 'carriers', ~{::#admin-content})}">

<section id="admin-content">
	<div class="container-fluid py-3">

		<div class="mb-4">
			<h2 class="fw-bold mb-1" th:text="${pageTitle}">Nhà vận chuyển</h2>
			<p class="text-muted mb-0">Nhập thông tin nhà vận chuyển bên
				dưới.</p>
		</div>

		<div th:if="${errorMessage}" class="alert alert-danger"
			th:text="${errorMessage}"></div>

		<div class="card border-0 shadow-sm">
			<div class="card-body p-4">
				<form th:object="${carrier}"
					th:action="${isEdit} ? @{/admin/carriers/{id}/edit(id=${carrier.id})} : @{/admin/carriers}"
					method="post">

					<div class="mb-3">
						<label for="name" class="form-label"> Tên nhà vận chuyển <span
							class="text-danger">*</span>
						</label> <input id="name" type="text" th:field="*{name}"
							class="form-control" maxlength="100" required
							placeholder="Ví dụ: Giao hàng nội bộ">
					</div>

					<div class="mb-3">
						<label for="fee" class="form-label"> Phí vận chuyển (VNĐ)
							<span class="text-danger">*</span>
						</label> <input id="fee" type="number" th:field="*{fee}"
							class="form-control" min="0" step="1" required>
						<div class="form-text">Đây là mức phí mặc định của nhà vận
							chuyển.</div>
					</div>

					<div class="d-flex justify-content-end gap-2 mt-4">
						<a th:href="@{/admin/carriers}" class="btn btn-outline-secondary">Hủy</a>
						<button type="submit" class="btn btn-primary">
							<i class="bi bi-check-lg"></i> Lưu thông tin
						</button>
					</div>
				</form>
			</div>
		</div>

	</div>
</section>
</html>
