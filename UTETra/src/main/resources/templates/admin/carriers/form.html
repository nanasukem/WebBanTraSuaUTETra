<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title
	th:text="${carrierId == null ? 'Thêm nhà vận chuyển' : 'Sửa nhà vận chuyển'} + ' - UTETra'">Nhà
	vận chuyển</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container py-4" style="max-width: 560px">

		<a th:href="@{/admin/carriers}" class="text-decoration-none"><i
			class="bi bi-arrow-left"></i> Quay lại danh sách</a>
		<h3 class="mt-2 mb-3"
			th:text="${carrierId == null ? 'Thêm nhà vận chuyển' : 'Sửa nhà vận chuyển #' + carrierId}"></h3>

		<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

		<form th:object="${carrierReq}" method="post" class="card card-body"
			novalidate
			th:action="${carrierId == null} ? @{/admin/carriers/create} : @{/admin/carriers/{id}/edit(id=${carrierId})}">

			<div class="mb-3">
				<label class="form-label">Tên nhà vận chuyển <span
					class="text-danger">*</span></label> <input type="text" th:field="*{name}"
					class="form-control" placeholder="VD: Giao Hàng Nhanh"
					th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
				<div class="invalid-feedback" th:errors="*{name}"></div>
			</div>

			<div class="mb-3">
				<label class="form-label">Phí vận chuyển <span
					class="text-danger">*</span></label>
				<div class="input-group has-validation">
					<input type="number" th:field="*{fee}" class="form-control" min="0"
						step="500" placeholder="15000"
						th:classappend="${#fields.hasErrors('fee')} ? 'is-invalid'">
					<span class="input-group-text">đ</span>
					<div class="invalid-feedback" th:errors="*{fee}"></div>
				</div>
			</div>

			<div class="d-flex gap-2">
				<button type="submit" class="btn btn-primary">
					<i class="bi bi-save"></i> Lưu
				</button>
				<a th:href="@{/admin/carriers}" class="btn btn-outline-secondary">Hủy</a>
			</div>
		</form>
	</div>
</body>
</html>
