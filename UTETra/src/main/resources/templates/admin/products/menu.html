```html
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/admin-layout :: main('Quản lý sản phẩm', 'products', ~{::#admin-products-content})}">

<body>
	<div id="admin-products-content">

		<div
			class="d-flex flex-wrap justify-content-between
                align-items-center gap-3 mb-4">
			<div>
				<h3 class="fw-bold mb-1">Quản lý sản phẩm</h3>
				<p class="text-muted mb-0">Thêm, cập nhật và quản lý danh sách
					sản phẩm UTETra.</p>
			</div>

			<a th:href="@{/admin/products/create}" class="btn btn-success"> <i
				class="bi bi-plus-lg me-1"></i> Thêm sản phẩm
			</a>
		</div>

		<!-- TÌM KIẾM -->
		<div class="card border-0 shadow-sm mb-4">
			<div class="card-body">
				<form th:action="@{/admin/products}" method="get" class="row g-3">

					<div class="col-md-9">
						<input type="text" name="keyword" th:value="${keyword}"
							class="form-control" placeholder="Tìm theo tên sản phẩm...">
					</div>

					<div class="col-md-3 d-grid">
						<button type="submit" class="btn btn-outline-success">
							<i class="bi bi-search me-1"></i> Tìm kiếm
						</button>
					</div>

				</form>
			</div>
		</div>

		<!-- BẢNG SẢN PHẨM -->
		<div class="card border-0 shadow-sm">
			<div class="card-body">
				<div class="table-responsive">
					<table class="table table-hover align-middle">
						<thead class="table-light">
							<tr>
								<th style="width: 70px;">ID</th>
								<th style="width: 100px;">Ảnh</th>
								<th>Tên sản phẩm</th>
								<th>Giá</th>
								<th>Mô tả</th>
								<th style="width: 170px;">Thao tác</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="p : ${products}">
								<td th:text="${p.id}">1</td>

								<td><img
									th:if="${p.imageCloudinaryId != null
                                             and !#strings.isEmpty(p.imageCloudinaryId)}"
									th:src="${p.imageCloudinaryId}" alt="Ảnh sản phẩm"
									style="width: 65px; height: 55px; object-fit: cover;"
									class="rounded">

									<div
										th:if="${p.imageCloudinaryId == null
                                             or #strings.isEmpty(p.imageCloudinaryId)}"
										class="bg-light rounded d-flex
                                            align-items-center justify-content-center"
										style="width: 65px; height: 55px;">
										<i class="bi bi-cup-hot text-success fs-4"></i>
									</div></td>

								<td class="fw-semibold"
									th:text="${p.name != null ? p.name : 'Chưa đặt tên'}">Tên
									sản phẩm</td>

								<td class="text-danger fw-bold"
									th:text="${p.basePrice != null
                                    ? #numbers.formatDecimal(p.basePrice, 0, 'COMMA', 0, 'POINT') + ' đ'
                                    : 'Chưa có giá'}">
									35,000 đ</td>

								<td
									th:text="${p.description != null
                                          ? p.description : ''}">
									Mô tả</td>

								<td>
									<div class="d-flex gap-2">
										<a th:href="@{/admin/products/edit/{id}(id=${p.id})}"
											class="btn btn-sm btn-outline-primary" title="Sửa"> <i
											class="bi bi-pencil-square"></i>
										</a>

										<form th:action="@{/admin/products/delete/{id}(id=${p.id})}"
											method="post"
											onsubmit="return confirm('Bạn có chắc muốn xóa sản phẩm này?');">
											<button type="submit" class="btn btn-sm btn-outline-danger"
												title="Xóa">
												<i class="bi bi-trash"></i>
											</button>
										</form>
									</div>
								</td>
							</tr>

							<tr th:if="${products == null or #lists.isEmpty(products)}">
								<td colspan="6" class="text-center text-muted py-4">Chưa có
									sản phẩm nào.</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

	</div>
</body>
</html>
