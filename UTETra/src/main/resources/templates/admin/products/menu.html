<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thực đơn trà sữa - UTETra</title>

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<style>
body {
	background-color: #f8f9fa;
}

.navbar-custom {
	background-color: #1b7a4b;
}

.btn-custom {
	background-color: #1b7a4b;
	color: white;
}

.btn-custom:hover {
	background-color: #145c37;
	color: white;
}

.product-card {
	transition: transform 0.2s ease-in-out;
}

.product-card:hover {
	transform: translateY(-4px);
}

.product-image, .img-placeholder {
	width: 100%;
	height: 180px;
}

.product-image {
	object-fit: cover;
}

.img-placeholder {
	background-color: #e9ecef;
	display: flex;
	align-items: center;
	justify-content: center;
	color: #6c757d;
	font-size: 1.2rem;
}

.price {
	color: #dc3545;
	font-weight: bold;
}
</style>
</head>

<body>

	<!-- THANH ĐIỀU HƯỚNG -->
	<nav class="navbar navbar-custom text-white py-3">
		<div
			class="container d-flex justify-content-between align-items-center">

			<a th:href="@{/menu}" class="navbar-brand text-white fw-bold fs-4">
				<i class="bi bi-cup-hot-fill"></i> UTETra
			</a>

			<div class="d-flex align-items-center gap-3">

				<!-- NÚT QUẢN TRỊ ADMIN -->
				<a
					th:if="${session.user != null
                and session.user.role != null
                and session.user.role.name != null
                and (session.user.role.name == 'ADMIN'
                or session.user.role.name == 'MANAGER')}"
					th:href="@{/admin/products}" class="btn btn-warning btn-sm fw-bold">

					<i class="bi bi-speedometer2"></i> Quản trị Admin
				</a>

				<!-- ĐÃ ĐĂNG NHẬP -->
				<div th:if="${session.user != null}"
					class="d-flex align-items-center">

					<span> Xin chào, <strong
						th:text="${session.user.fullName != null
                        ? session.user.fullName
                        : session.user.username}">
							Người dùng </strong>
					</span> <a th:href="@{/auth/logout}"
						class="btn btn-outline-light btn-sm ms-2"> Đăng xuất </a>
				</div>

				<!-- CHƯA ĐĂNG NHẬP -->
				<div th:if="${session.user == null}">
					<a th:href="@{/auth/login}" class="btn btn-outline-light btn-sm">
						Đăng nhập </a>
				</div>

			</div>
		</div>
	</nav>

	<!-- NỘI DUNG CHÍNH -->
	<div class="container py-4">

		<!-- TÌM KIẾM VÀ LỌC -->
		<div class="card border-0 shadow-sm mb-4">
			<div class="card-body">

				<form th:action="@{/menu}" method="get"
					class="row g-3 align-items-center">

					<!-- TÌM KIẾM -->
					<div class="col-md-6">
						<div class="input-group">

							<span class="input-group-text bg-white"> <i
								class="bi bi-search"></i>
							</span> <input type="text" name="keyword" th:value="${keyword}"
								class="form-control" placeholder="Tìm tên món (nhấn Enter)...">
						</div>
					</div>

					<!-- LỌC DANH MỤC -->
					<div class="col-md-3">
						<select name="categoryId" class="form-select"
							onchange="this.form.submit()">

							<option value="" th:selected="${selectedCategory == null}">
								Tất cả danh mục</option>

							<th:block th:if="${categories != null}">
								<th:block th:each="c : ${categories}">

									<option th:if="${c != null and c.id != null}"
										th:value="${c.id}"
										th:text="${c.name != null ? c.name : 'Chưa đặt tên'}"
										th:selected="${selectedCategory != null
                                            and c.id.toString() == selectedCategory.toString()}">
									</option>

								</th:block>
							</th:block>

						</select>
					</div>

					<!-- SẮP XẾP -->
					<div class="col-md-3">
						<select name="sortBy" class="form-select"
							onchange="this.form.submit()">

							<option value="newest"
								th:selected="${sortBy == null or sortBy == 'newest'}">
								Mới nhất</option>

							<option value="sold" th:selected="${sortBy == 'sold'}">
								Bán chạy nhất</option>

							<option value="price_asc" th:selected="${sortBy == 'price_asc'}">
								Giá: Thấp đến cao</option>

							<option value="price_desc"
								th:selected="${sortBy == 'price_desc'}">Giá: Cao đến
								thấp</option>

						</select>
					</div>

				</form>
			</div>
		</div>

		<!-- TIÊU ĐỀ -->
		<div class="mb-4">
			<h3 class="fw-bold">Thực đơn UTETra</h3>

			<p class="text-muted">Khám phá những món đồ uống yêu thích của
				bạn.</p>
		</div>

		<!-- DANH SÁCH SẢN PHẨM -->
		<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">

			<th:block th:if="${products != null and !#lists.isEmpty(products)}">

				<th:block th:each="p : ${products}">

					<div class="col" th:if="${p != null}">

						<div
							class="card h-100 border-0 shadow-sm product-card rounded-3 overflow-hidden">

							<!-- ẢNH SẢN PHẨM -->
							<img
								th:if="${p.imageCloudinaryId != null
                            and !#strings.isEmpty(p.imageCloudinaryId)
                            and #strings.startsWith(p.imageCloudinaryId, 'http')}"
								th:src="${p.imageCloudinaryId}"
								class="card-img-top product-image" alt="Ảnh sản phẩm">

							<!-- ẢNH MẶC ĐỊNH -->
							<div
								th:if="${p.imageCloudinaryId == null
                            or #strings.isEmpty(p.imageCloudinaryId)
                            or !#strings.startsWith(p.imageCloudinaryId, 'http')}"
								class="img-placeholder">

								<i class="bi bi-cup-hot-fill me-2"></i> UTETra
							</div>

							<!-- THÔNG TIN SẢN PHẨM -->
							<div class="card-body d-flex flex-column justify-content-between">

								<div>
									<h6 class="card-title fw-bold"
										th:text="${p.name != null ? p.name : 'Chưa đặt tên'}">
										Tên món</h6>

									<p class="card-text text-muted small"
										th:text="${p.description != null ? p.description : ''}">
										Mô tả sản phẩm</p>
								</div>

								<div
									class="d-flex justify-content-between align-items-center mt-3">

									<span class="price"
										th:text="${p.basePrice != null
                                        ? #numbers.formatDecimal(p.basePrice, 0, 'COMMA', 0, 'POINT') + ' đ'
                                        : 'Chưa có giá'}">
										35,000 đ </span>

									<button type="button"
										class="btn btn-custom btn-sm rounded-circle" title="Thêm món">

										<i class="bi bi-plus-lg"></i>
									</button>

								</div>
							</div>

						</div>
					</div>

				</th:block>
			</th:block>

			<!-- KHÔNG CÓ SẢN PHẨM -->
			<div class="col-12 text-center py-5"
				th:if="${products == null or #lists.isEmpty(products)}">

				<i class="bi bi-emoji-frown text-muted display-4"></i>

				<p class="mt-3 text-muted fw-bold">Không tìm thấy món nào phù
					hợp!</p>

			</div>

		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
