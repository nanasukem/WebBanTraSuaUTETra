<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Quản lý danh mục - UTETra</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
	rel="stylesheet">

<style>
:root {
	--primary: #198754;
	--primary-dark: #146c43;
	--background: #f5f7f6;
	--text: #25352c;
	--border: #e2e8e4;
}

* {
	box-sizing: border-box;
}

body {
	margin: 0;
	background: var(--background);
	color: var(--text);
	font-family: Arial, Helvetica, sans-serif;
}

.page-container {
	width: 100%;
	padding: 28px 32px;
}

.page-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 20px;
	margin-bottom: 28px;
}

.page-title {
	margin: 0 0 8px;
	color: #176b3a;
	font-size: 36px;
	font-weight: 700;
}

.page-description {
	margin: 0;
	color: #718078;
	font-size: 16px;
}

.btn-primary-custom {
	background: var(--primary);
	border: 1px solid var(--primary);
	color: #fff;
	border-radius: 7px;
	padding: 10px 16px;
	white-space: nowrap;
}

.btn-primary-custom:hover {
	background: var(--primary-dark);
	border-color: var(--primary-dark);
	color: #fff;
}

.panel {
	padding: 28px 26px;
	margin-bottom: 26px;
	background: #fff;
	border: 1px solid #e5ebe7;
	border-radius: 16px;
	box-shadow: 0 3px 12px rgba(0, 0, 0, .04);
}

.form-label {
	display: block;
	margin-bottom: 10px;
	color: #405248;
	font-weight: 500;
}

.form-control {
	min-height: 43px;
	border-color: #dce3df;
	border-radius: 7px;
}

.form-control:focus {
	border-color: var(--primary);
	box-shadow: 0 0 0 .2rem rgba(25, 135, 84, .12);
}

.filter-actions {
	display: flex;
	gap: 10px;
	align-items: end;
}

.filter-actions .btn {
	min-height: 43px;
	min-width: 110px;
}

.panel-heading {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	margin-bottom: 20px;
}

.panel-title {
	margin: 0;
	font-size: 23px;
	font-weight: 600;
}

.count-badge {
	background: var(--primary);
	color: #fff;
	padding: 5px 10px;
	border-radius: 6px;
	font-size: 13px;
	font-weight: 600;
	white-space: nowrap;
}

.table {
	margin-bottom: 0;
}

.table thead th {
	padding: 14px 10px;
	background: #f5f8f6;
	color: #405248;
	font-weight: 700;
	white-space: nowrap;
	border-bottom: 1px solid #dce4df;
}

.table tbody td {
	padding: 12px 10px;
	vertical-align: middle;
	border-bottom: 1px solid #dce4df;
}

.table tbody tr:last-child td {
	border-bottom: none;
}

.category-image {
	width: 66px;
	height: 66px;
	object-fit: cover;
	border: 1px solid #e5ebe7;
	border-radius: 12px;
}

.no-image {
	display: flex;
	align-items: center;
	justify-content: center;
	width: 66px;
	height: 66px;
	padding: 5px;
	background: #edf2ee;
	border-radius: 12px;
	color: #718078;
	font-size: 12px;
	text-align: center;
}

.category-name {
	font-weight: 600;
	color: #17251c;
}

.actions {
	display: flex;
	flex-wrap: wrap;
	gap: 7px;
}

.actions .btn {
	white-space: nowrap;
}

.empty-state {
	padding: 45px 20px !important;
	color: #718078;
	text-align: center;
}

@media ( max-width : 768px) {
	.page-container {
		padding: 20px 14px;
	}
	.page-header {
		align-items: flex-start;
		flex-direction: column;
	}
	.page-title {
		font-size: 28px;
	}
	.panel {
		padding: 20px 15px;
	}
	.filter-actions {
		margin-top: 12px;
	}
	.filter-actions .btn {
		flex: 1;
		min-width: 0;
	}
}
</style>
</head>

<body>

	<div class="page-container">

		<!-- Tiêu đề trang -->
		<div class="page-header">
			<div>
				<h1 class="page-title">Quản lý danh mục</h1>
				<p class="page-description">Quản lý các danh mục sản phẩm của
					UTETra.</p>
			</div>

			<a th:href="@{/admin/categories/create}"
				class="btn btn-primary-custom"> <i class="bi bi-plus-lg me-1"></i>
				Thêm danh mục
			</a>
		</div>

		<!-- Thông báo -->
		<div th:if="${successMessage}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i> <span
				th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="Đóng"></button>
		</div>

		<div th:if="${errorMessage}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> <span
				th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="Đóng"></button>
		</div>

		<!-- Khung tìm kiếm giống Product -->
		<div class="panel">
			<form th:action="@{/admin/categories}" method="get">

				<div class="row g-3 align-items-end">

					<div class="col-12 col-md-8">
						<label for="keyword" class="form-label"> Tìm theo tên danh
							mục </label> <input type="text" class="form-control" id="keyword"
							name="keyword" th:value="${keyword}"
							placeholder="Nhập tên danh mục...">
					</div>

					<div class="col-12 col-md-4">
						<div class="filter-actions">
							<button type="submit" class="btn btn-primary-custom flex-grow-1">
								<i class="bi bi-search me-1"></i> Tìm
							</button>

							<a th:href="@{/admin/categories}"
								class="btn btn-outline-secondary"> Xóa lọc </a>
						</div>
					</div>

				</div>
			</form>
		</div>

		<!-- Bảng danh mục giống bảng Product -->
		<div class="panel">

			<div class="panel-heading">
				<h2 class="panel-title">Danh sách danh mục</h2>

				<span class="count-badge"> <span
					th:text="${#lists.size(categories)}">0</span> danh mục
				</span>
			</div>

			<div class="table-responsive">
				<table class="table">
					<thead>
						<tr>
							<th style="width: 65px;">ID</th>
							<th style="width: 100px;">Ảnh</th>
							<th>Tên danh mục</th>
							<th style="min-width: 190px;">Thao tác</th>
						</tr>
					</thead>

					<tbody>
						<tr th:each="category : ${categories}">

							<td th:text="${category.id}">1</td>

							<td><img
								th:if="${category.imageCloudinaryId != null
                                     and !#strings.isEmpty(category.imageCloudinaryId)}"
								th:src="${category.imageCloudinaryId}" th:alt="${category.name}"
								class="category-image">

								<div
									th:unless="${category.imageCloudinaryId != null
                                         and !#strings.isEmpty(category.imageCloudinaryId)}"
									class="no-image">Chưa có ảnh</div></td>

							<td><span class="category-name" th:text="${category.name}">
									Tên danh mục </span></td>

							<td>
								<div class="actions">

									<a th:href="@{/admin/categories/{id}/edit(id=${category.id})}"
										class="btn btn-sm btn-outline-primary"> <i
										class="bi bi-pencil-square me-1"></i> Sửa
									</a>

									<form
										th:action="@{/admin/categories/{id}/delete(id=${category.id})}"
										method="post" class="d-inline"
										onsubmit="return confirm('Bạn có chắc chắn muốn xóa danh mục này không?');">

										<button type="submit" class="btn btn-sm btn-outline-danger">
											<i class="bi bi-trash me-1"></i> Xóa
										</button>
									</form>

								</div>
							</td>
						</tr>

						<tr th:if="${#lists.isEmpty(categories)}">
							<td colspan="4" class="empty-state"><i
								class="bi bi-inbox fs-1 d-block mb-2"></i>

								<div class="fw-semibold">Không tìm thấy danh mục nào</div>

								<div class="small mt-1">Thử thay đổi từ khóa tìm kiếm hoặc
									thêm danh mục mới.</div></td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
