<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/admin-layout :: main('Quản lý danh mục', 'categories', ~{::content})}">

<body>
	<th:block th:fragment="content">

		<div class="container-fluid">

			<!-- Tiêu đề -->
			<div class="d-flex justify-content-between align-items-center mb-4">
				<div>
					<h2 class="fw-bold mb-1">
						<i class="bi bi-tags text-primary"></i> Quản lý danh mục
					</h2>
					<p class="text-muted mb-0">Quản lý các danh mục sản phẩm của
						UTETra</p>
				</div>

				<button type="button" class="btn btn-primary"
					onclick="openAddModal()">
					<i class="bi bi-plus-circle"></i> Thêm danh mục
				</button>
			</div>

			<!-- Thông báo -->
			<div th:if="${successMsg}"
				class="alert alert-success alert-dismissible fade show">
				<i class="bi bi-check-circle"></i> <span th:text="${successMsg}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<div th:if="${errorMsg}"
				class="alert alert-danger alert-dismissible fade show">
				<i class="bi bi-exclamation-circle"></i> <span th:text="${errorMsg}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<!-- Thống kê -->
			<div class="card border-0 shadow-sm mb-4">
				<div class="card-body d-flex align-items-center">
					<div
						class="rounded-circle bg-primary bg-opacity-10
                            p-3 me-3">
						<i class="bi bi-tags fs-3 text-primary"></i>
					</div>

					<div>
						<div class="text-muted">Tổng số danh mục</div>
						<h4 class="fw-bold mb-0" th:text="${#lists.size(categories)}">0</h4>
					</div>
				</div>
			</div>

			<!-- Danh sách danh mục -->
			<div class="card border-0 shadow-sm">
				<div class="card-header bg-white py-3">
					<h5 class="mb-0 fw-bold">Danh sách danh mục</h5>
				</div>

				<div class="card-body">

					<div class="table-responsive">
						<table class="table table-hover align-middle">
							<thead class="table-light">
								<tr>
									<th style="width: 80px;">ID</th>
									<th style="width: 130px;">Hình ảnh</th>
									<th>Tên danh mục</th>
									<th class="text-center" style="width: 180px;">Thao tác</th>
								</tr>
							</thead>

							<tbody>
								<tr th:each="category : ${categories}">
									<td th:text="${category.id}"></td>

									<td><img
										th:if="${category.imageCloudinaryId != null
                                           and !#strings.isEmpty(category.imageCloudinaryId)}"
										th:src="${category.imageCloudinaryId}" alt="Ảnh danh mục"
										class="category-image">

										<div
											th:unless="${category.imageCloudinaryId != null
                                                and !#strings.isEmpty(category.imageCloudinaryId)}"
											class="category-placeholder">
											<i class="bi bi-image text-secondary"></i>
										</div></td>

									<td><span class="fw-semibold" th:text="${category.name}"></span>
									</td>

									<td class="text-center">
										<button type="button"
											class="btn btn-sm btn-outline-primary me-1"
											th:attr="data-id=${category.id},
                                                 data-name=${category.name},
                                                 data-image=${category.imageCloudinaryId}"
											onclick="openEditModal(this)">
											<i class="bi bi-pencil-square"></i> Sửa
										</button>

										<button type="button" class="btn btn-sm btn-outline-danger"
											th:attr="data-id=${category.id},
                                                 data-name=${category.name}"
											onclick="confirmDelete(this)">
											<i class="bi bi-trash"></i> Xóa
										</button>
									</td>
								</tr>

								<tr th:if="${#lists.isEmpty(categories)}">
									<td colspan="4" class="text-center py-5"><i
										class="bi bi-inbox display-5 text-muted"></i>
										<p class="text-muted mt-2 mb-0">Chưa có danh mục nào.</p></td>
								</tr>
							</tbody>
						</table>
					</div>

				</div>
			</div>

		</div>

		<!-- Modal thêm / sửa danh mục -->
		<div class="modal fade" id="categoryModal" tabindex="-1"
			aria-hidden="true">

			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content border-0 shadow">

					<form th:action="@{/admin/categories/save}" method="post"
						enctype="multipart/form-data" th:object="${categoryDTO}">

						<div class="modal-header">
							<h5 class="modal-title fw-bold" id="categoryModalTitle">
								Thêm danh mục</h5>

							<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
						</div>

						<div class="modal-body">

							<!-- CSRF cho Spring Security -->
							<input type="hidden" th:if="${_csrf != null}"
								th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

							<input type="hidden" th:field="*{id}"> <input
								type="hidden" th:field="*{existingImageUrl}">

							<div class="mb-3">
								<label for="categoryName" class="form-label fw-semibold">
									Tên danh mục <span class="text-danger">*</span>
								</label> <input type="text" id="categoryName" th:field="*{name}"
									class="form-control" placeholder="Ví dụ: Trà sữa"
									maxlength="100" required>
							</div>

							<div class="mb-3">
								<label for="imageFile" class="form-label fw-semibold">
									Ảnh danh mục </label> <input type="file" id="imageFile"
									th:field="*{imageFile}" class="form-control" accept="image/*"
									onchange="previewImage(this)"> <small
									class="text-muted"> Có thể bỏ trống nếu không muốn thay
									ảnh. </small>
							</div>

							<div class="text-center">
								<img id="imagePreview" src="" alt="Xem trước ảnh"
									class="category-preview d-none">

								<div id="noImagePreview" class="category-placeholder mx-auto">
									<i class="bi bi-image text-secondary"></i>
								</div>
							</div>

						</div>

						<div class="modal-footer">
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">Hủy</button>

							<button type="submit" class="btn btn-primary">
								<i class="bi bi-save"></i> Lưu danh mục
							</button>
						</div>

					</form>
				</div>
			</div>
		</div>

		<!-- Form xóa danh mục -->
		<form id="deleteCategoryForm" method="post">
			<input type="hidden" th:if="${_csrf != null}"
				th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
		</form>

		<!-- JavaScript -->
		<script>
			let categoryModal;

			document.addEventListener('DOMContentLoaded', function() {
				categoryModal = new bootstrap.Modal(document
						.getElementById('categoryModal'));
			});

			function openAddModal() {
				const form = document.querySelector('#categoryModal form');

				form.reset();

				document.getElementById('categoryModalTitle').textContent = 'Thêm danh mục';

				document.getElementById('id').value = '';
				document.getElementById('existingImageUrl').value = '';

				resetPreview();

				categoryModal.show();
			}

			function openEditModal(button) {
				const id = button.dataset.id;
				const name = button.dataset.name;
				const image = button.dataset.image || '';

				const form = document.querySelector('#categoryModal form');

				form.reset();

				document.getElementById('categoryModalTitle').textContent = 'Cập nhật danh mục';

				document.getElementById('id').value = id;
				document.getElementById('categoryName').value = name;
				document.getElementById('existingImageUrl').value = image;

				const preview = document.getElementById('imagePreview');
				const placeholder = document.getElementById('noImagePreview');

				if (image.trim() !== '') {
					preview.src = image;
					preview.classList.remove('d-none');
					placeholder.classList.add('d-none');
				} else {
					resetPreview();
				}

				categoryModal.show();
			}

			function previewImage(input) {
				const preview = document.getElementById('imagePreview');
				const placeholder = document.getElementById('noImagePreview');

				if (input.files && input.files[0]) {
					const reader = new FileReader();

					reader.onload = function(event) {
						preview.src = event.target.result;
						preview.classList.remove('d-none');
						placeholder.classList.add('d-none');
					};

					reader.readAsDataURL(input.files[0]);
				}
			}

			function resetPreview() {
				const preview = document.getElementById('imagePreview');
				const placeholder = document.getElementById('noImagePreview');

				preview.src = '';
				preview.classList.add('d-none');
				placeholder.classList.remove('d-none');
			}

			function confirmDelete(button) {
				const id = button.dataset.id;
				const name = button.dataset.name;

				if (confirm('Bạn có chắc muốn xóa danh mục "' + name
						+ '" không?')) {
					const form = document.getElementById('deleteCategoryForm');

					form.action = '/admin/categories/delete/' + id;
					form.submit();
				}
			}
		</script>

		<style>
.category-image, .category-placeholder {
	width: 76px;
	height: 64px;
	border-radius: 8px;
	object-fit: cover;
}

.category-placeholder {
	display: flex;
	align-items: center;
	justify-content: center;
	background: #f1f3f5;
	font-size: 25px;
}

.category-preview {
	max-width: 100%;
	width: 180px;
	height: 140px;
	object-fit: contain;
	border-radius: 8px;
	border: 1px solid #dee2e6;
	padding: 5px;
}

.table th {
	white-space: nowrap;
}
</style>

	</th:block>
</body>
</html>
