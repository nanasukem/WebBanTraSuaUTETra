<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/auth-layout :: main('Đổi mật khẩu - UTETra', ~{::#change-password-content})}">

<body>
	<div id="change-password-content" class="container">
		<div class="card auth-card shadow-sm mx-auto p-4">
			<div class="text-center mb-3">
				<h4 class="fw-bold text-success mb-1"><i class="bi bi-shield-lock me-1"></i>Đổi mật khẩu</h4>
				<p class="text-muted small mb-0">Tài khoản <b th:text="${account.username}">manager1</b></p>
			</div>

			<div th:if="${forced}" class="alert alert-warning small py-2">
				<i class="bi bi-exclamation-triangle-fill me-1"></i> Bạn đang dùng <b>mật khẩu tạm</b> do quản trị viên cấp.
				Vui lòng đặt mật khẩu mới của riêng bạn để tiếp tục.
			</div>
			<div th:if="${errorMessage}" class="alert alert-danger small py-2" th:text="${errorMessage}"></div>

			<form method="post" th:action="@{/account/change-password}" autocomplete="off">
				<div class="mb-3">
					<label for="cpCurrent" class="form-label fw-semibold"
						th:text="${forced} ? 'Mật khẩu tạm (Admin cấp)' : 'Mật khẩu hiện tại'">Mật khẩu hiện tại</label>
					<input type="password" id="cpCurrent" name="currentPassword" class="form-control" required
						autocomplete="current-password">
				</div>
				<div class="mb-3">
					<label for="cpNew" class="form-label fw-semibold">Mật khẩu mới</label>
					<input type="password" id="cpNew" name="newPassword" class="form-control" required minlength="6" maxlength="72" autocomplete="new-password">
					<div class="form-text">Tối thiểu 6 ký tự, khác mật khẩu hiện tại.</div>
				</div>
				<div class="mb-4">
					<label for="cpConfirm" class="form-label fw-semibold">Nhập lại mật khẩu mới</label>
					<input type="password" id="cpConfirm" name="confirmPassword" class="form-control" required minlength="6" maxlength="72" autocomplete="new-password">
				</div>
				<button type="submit" class="btn btn-success w-100"><i class="bi bi-check-lg me-1"></i> Đổi mật khẩu</button>
			</form>

			<div class="d-flex justify-content-between mt-3 small">
				<a th:unless="${forced}" href="javascript:history.back()" class="link-secondary">← Quay lại</a>
				<form th:action="@{/auth/logout}" method="post" class="m-0 ms-auto">
					<button type="submit" class="btn btn-link btn-sm p-0 link-danger">Đăng xuất</button>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
