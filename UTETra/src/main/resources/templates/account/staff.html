<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tài khoản của tôi - UTETra</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<header class="bg-success text-white py-2 px-3 d-flex justify-content-between align-items-center mb-4 shadow-sm">
		<div class="fw-bold"><i class="bi bi-scooter me-1"></i> Shipper UTETra</div>
		<div class="d-flex gap-2">
			<a th:href="@{/shipper/orders}" class="btn btn-sm btn-light fw-semibold"><i class="bi bi-arrow-left me-1"></i>Đơn giao hàng</a>
			<form th:action="@{/auth/logout}" method="post" class="m-0">
				<button type="submit" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right me-1"></i>Đăng xuất</button>
			</form>
		</div>
	</header>
	<main class="container pb-5">
		<div th:replace="~{account/body :: body}"></div>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
