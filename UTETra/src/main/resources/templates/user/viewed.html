<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/user-layout :: main('Sản phẩm đã xem - UTETra', ~{::#viewed-content})}">

<!-- TRANG SẢN PHẨM ĐÃ XEM (USER) /user/viewed: món đã mở trang chi tiết, xem gần nhất lên đầu (tối đa 40 món) -->
<body>
	<div id="viewed-content">
		<div class="row g-4">
			<div class="col-lg-3">
				<div th:replace="~{fragments/user-sidebar :: sidebar('viewed')}"></div>
			</div>
			<div class="col-lg-9">
				<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

				<section class="bg-white rounded-4 shadow-sm p-4 mb-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
					<div>
						<h1 class="h4 fw-bold text-success mb-1"><i class="bi bi-clock-history me-1"></i> Sản phẩm đã xem</h1>
						<p class="text-muted mb-0"><strong th:text="${#lists.size(products)}">0</strong> món, xem gần nhất lên đầu</p>
					</div>
					<form th:if="${!#lists.isEmpty(products)}" th:action="@{/user/viewed/clear}" method="post"
						onsubmit="return confirm('Xoá toàn bộ lịch sử xem?')">
						<button type="submit" class="btn btn-outline-secondary btn-sm"><i class="bi bi-trash me-1"></i> Xoá lịch sử</button>
					</form>
				</section>

				<div class="row g-3" th:unless="${#lists.isEmpty(products)}">
					<div class="col-6 col-md-4" th:each="p : ${products}">
						<div th:replace="~{fragments/product-card :: card(${p}, ${cardMode})}"></div>
					</div>
				</div>

				<div class="card border-0 shadow-sm rounded-4" th:if="${#lists.isEmpty(products)}">
					<div class="card-body text-center py-5">
						<i class="bi bi-eye text-success" style="font-size: 3rem;"></i>
						<h2 class="h5 mt-3">Chưa xem món nào</h2>
						<p class="text-muted">Món bạn mở xem chi tiết sẽ hiện ở đây.</p>
						<a th:href="@{/menu}" class="btn btn-success">Xem thực đơn</a>
					</div>
				</div>
			</div>
		</div>

		<div th:replace="~{fragments/product-modal :: productModal}"></div>
	</div>
</body>
</html>
