<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="bar" class="menu-branch-bar d-flex flex-wrap align-items-center gap-2 bg-white border rounded-4 shadow-sm px-3 py-2 mb-3">
	<i class="bi bi-shop text-success fs-5"></i>

	<th:block th:if="${menuBranchLocked}">
		<span class="small text-muted">Menu tại</span>
		<b th:text="${menuBranch != null} ? ${menuBranch.name} : 'chi nhánh của bạn'">UTETra Võ Văn Ngân</b>
		<span class="small text-muted ms-auto">Món hết ở chi nhánh bạn có nhãn <span class="badge text-bg-warning">Hết ở chi nhánh</span></span>
	</th:block>

	<form th:unless="${menuBranchLocked}" th:action="@{/menu/branch}" method="post"
		class="d-flex flex-wrap align-items-center gap-2 flex-grow-1 m-0">
		<label for="menuBranchSelect" class="small text-muted mb-0">Đang đặt tại</label>
		<select id="menuBranchSelect" name="branchId" class="form-select form-select-sm w-auto fw-semibold"
			onchange="this.form.submit()">
			<option value="">Chọn chi nhánh khi thanh toán</option>
			<option th:each="b : ${menuBranches}" th:value="${b.id}" th:text="${b.name}"
				th:selected="${menuBranch != null and menuBranch.id == b.id}">UTETra Võ Văn Ngân</option>
		</select>
		<noscript><button type="submit" class="btn btn-sm btn-success">Chọn</button></noscript>
		<span class="badge rounded-pill text-bg-success" th:if="${menuBranch != null and menuBranchAuto}"><i class="bi bi-geo-alt me-1"></i>Gần bạn nhất</span>
		<span class="small text-muted ms-auto" th:if="${menuBranch == null}" id="menuBranchHint">Chọn chi nhánh để biết món nào đang hết</span>
		<span class="small text-muted ms-auto" th:if="${menuBranch != null}"
			th:text="${menuBranch.hoursLabel} + ' · ' + ${menuBranch.address}">7:00 - 22:00 · 1 Võ Văn Ngân</span>
	</form>

	<script th:if="${menuBranchAsk}">
		(function () {
			try { if (sessionStorage.getItem('utetraAskedLocation')) return; sessionStorage.setItem('utetraAskedLocation', '1'); } catch (e) { }
			if (!navigator.geolocation) return;
			const hint = document.getElementById('menuBranchHint');
			if (hint) hint.textContent = 'Đang tìm chi nhánh gần bạn...';
			navigator.geolocation.getCurrentPosition(function (pos) {
				fetch('/menu/branch/nearest?lat=' + pos.coords.latitude + '&lng=' + pos.coords.longitude, { method: 'POST' })
					.then(function (r) { return r.json(); })
					.then(function (d) { if (d.chosen) location.reload(); else if (hint) hint.textContent = 'Chọn chi nhánh để biết món nào đang hết'; })
					.catch(function () { });
			}, function () {
				if (hint) hint.textContent = 'Chọn chi nhánh để biết món nào đang hết';
			}, { timeout: 8000, maximumAge: 600000 });
		})();
	</script>
</div>
</html>
