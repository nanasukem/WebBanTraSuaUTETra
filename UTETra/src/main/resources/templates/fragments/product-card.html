<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="card(p, mode)"
	class="card product-card h-100 border-0 shadow-sm rounded-4 overflow-hidden"
	th:classappend="${!p.available} ? 'product-stopped' : ''"
	th:with="outHere=${p.available and menuOutIds != null and menuOutIds.contains(p.id)}">

	<a th:href="@{/products/{id}(id=${p.id})}"
		class="d-block bg-light position-relative overflow-hidden"
		style="aspect-ratio: 4/5;" th:aria-label="'Xem chi tiết ' + ${p.name}">
		<img
		th:if="${p.imageCloudinaryId != null and !#strings.isEmpty(p.imageCloudinaryId)}"
		th:src="${p.imageCloudinaryId}" th:alt="${p.name}"
		class="w-100 h-100 product-card-img"
		style="object-fit: cover; object-position: center; transition: transform .3s ease;"
		loading="lazy">
		<div
			th:unless="${p.imageCloudinaryId != null and !#strings.isEmpty(p.imageCloudinaryId)}"
			class="w-100 h-100 d-flex justify-content-center align-items-center text-secondary">
			<i class="bi bi-cup-hot" style="font-size: 3rem;"></i>
		</div> <span
		class="badge bg-dark bg-opacity-75 position-absolute bottom-0 start-0 m-2 fw-normal"
		th:text="|Đã bán ${p.soldCount}|">Đã bán 0</span> <span
		th:if="${!p.available}"
		class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center"
		style="background: rgba(255, 255, 255, .55);"> <span
			class="badge bg-secondary fs-6 px-3 py-2"><i
				class="bi bi-slash-circle me-1"></i>Ngừng bán</span>
	</span> <span th:if="${outHere}"
		class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center"
		style="background: rgba(255, 255, 255, .55);"> <span
			class="badge bg-warning text-dark fs-6 px-3 py-2"><i
				class="bi bi-exclamation-circle me-1"></i>Hết ở chi nhánh</span>
	</span>
	</a>

	<div class="card-body d-flex flex-column p-3">
		<div class="small text-muted mb-1" th:text="${p.categoryName}">Trà
			sữa</div>
		<h3 class="h6 fw-bold mb-1">
			<a th:href="@{/products/{id}(id=${p.id})}"
				class="text-dark text-decoration-none" th:text="${p.name}">Tên
				món</a>
		</h3>

		<div class="small mb-2"
			th:if="${p.reviewCount > 0 or p.favoriteCount > 0}">
			<span th:if="${p.reviewCount > 0}" class="me-2"> <i
				class="bi bi-star-fill text-warning"></i> <strong
				th:text="${#numbers.formatDecimal(p.avgRating, 1, 1, 'POINT')}">4.8</strong>
				<span class="text-muted" th:text="|(${p.reviewCount})|">(3)</span>
			</span> <span th:if="${p.favoriteCount > 0}"> <i
				class="bi bi-heart-fill text-danger"></i> <span class="text-muted"
				th:text="${p.favoriteCount}">5</span>
			</span>
		</div>

		<div
			class="mt-auto pt-1 d-flex justify-content-between align-items-center gap-2">
			<span class="fw-bold text-success"
				th:text="${#numbers.formatDecimal(p.basePrice, 0, 'POINT', 0, 'COMMA')} + ' đ'">35.000
				đ</span> <span th:if="${!p.available}"
				class="badge text-bg-light border text-secondary">Ngừng bán</span> <span
				th:if="${outHere}" class="badge text-bg-warning">Hết ở chi
				nhánh</span>

			<button th:if="${mode == 'buy' and p.available and !outHere}"
				type="button"
				class="btn btn-success btn-sm rounded-circle d-inline-flex align-items-center justify-content-center js-open-product"
				style="width: 36px; height: 36px; flex-shrink: 0;"
				th:attr="data-id=${p.id}, data-name=${p.name}, data-price=${p.basePrice},
				         data-image=${p.imageCloudinaryId}, data-description=${p.description}"
				th:aria-label="'Chọn ' + ${p.name}">
				<i class="bi bi-plus-lg"></i>
			</button>

			<a th:if="${mode == 'guest' and p.available and !outHere}"
				th:href="@{/auth/login}"
				class="btn btn-outline-success btn-sm rounded-circle d-inline-flex align-items-center justify-content-center"
				style="width: 36px; height: 36px; flex-shrink: 0;"
				title="Đăng nhập để đặt món"> <i class="bi bi-plus-lg"></i>
			</a>
		</div>
	</div>
</div>

<section
	th:fragment="hlAjax(blockId, type, icon, title, subtitle, pg, mode)"
	th:id="${blockId}"
	class="hl-ajax bg-white rounded-4 shadow-sm p-3 p-md-4 mb-4"
	style="scroll-margin-top: 90px;"
	th:attr="data-url=@{/menu/highlight/{t}(t=${type})}">

	<div
		class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
		<div>
			<h2 class="h5 fw-bold mb-0">
				<i th:class="${icon} + ' me-1'"></i> <span th:text="${title}">Bán
					chạy</span>
			</h2>
			<small class="text-muted" th:text="${subtitle}">20 món bán
				nhiều nhất</small>
		</div>
		<span class="badge rounded-pill text-bg-light border"
			th:text="|Top ${pg.total} món|">Top 20 món</span>
	</div>

	<div
		th:replace="~{fragments/product-card :: hlBody(pg=${pg}, mode=${mode})}"></div>
</section>

<div th:fragment="hlBody" class="hl-body">

	<div class="row g-3" th:unless="${#lists.isEmpty(pg.items)}">
		<div class="col-6 col-md-4 col-lg-3" th:each="p, st : ${pg.items}">
			<div class="position-relative h-100">
				<span
					class="badge rounded-pill bg-success position-absolute top-0 start-0 m-2 shadow-sm"
					style="z-index: 2;" th:text="'#' + ${pg.offset + st.count}">#1</span>
				<div th:replace="~{fragments/product-card :: card(${p}, ${mode})}"></div>
			</div>
		</div>
	</div>

	<p class="text-muted mb-0" th:if="${#lists.isEmpty(pg.items)}">Chưa
		có món nào.</p>

	<div
		class="d-flex flex-wrap justify-content-center align-items-center gap-1 mt-3"
		th:if="${pg.totalPages > 1}">
		<button type="button" class="btn btn-sm btn-outline-success hl-go"
			aria-label="Trang trước" th:attr="data-page=${pg.page - 1}"
			th:disabled="${pg.page == 0}">
			<i class="bi bi-chevron-left"></i>
		</button>
		<button type="button" class="btn btn-sm hl-go"
			style="min-width: 34px;"
			th:each="i : ${#numbers.sequence(0, pg.totalPages - 1)}"
			th:classappend="${i == pg.page} ? 'btn-success' : 'btn-outline-success'"
			th:attr="data-page=${i}" th:text="${i + 1}">1</button>
		<button type="button" class="btn btn-sm btn-outline-success hl-go"
			aria-label="Trang sau" th:attr="data-page=${pg.page + 1}"
			th:disabled="${pg.page >= pg.totalPages - 1}">
			<i class="bi bi-chevron-right"></i>
		</button>
		<small class="text-muted ms-2"
			th:text="|Hạng ${pg.offset + 1}–${pg.offset + #lists.size(pg.items)} / ${pg.total}|">Hạng
			1–8 / 20</small>
	</div>
</div>

</html>
