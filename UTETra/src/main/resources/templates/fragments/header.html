<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<header th:fragment="header"
	class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm py-2 sticky-top"
	th:with="roleName=${session.user != null and session.user.role != null ? session.user.role.name : ''},
	         isGuest=${session.user == null},
	         isBuyer=${roleName == 'USER'},
	         isManager=${roleName == 'MANAGER'},
	         isAdmin=${roleName == 'ADMIN'},
	         isStaff=${roleName == 'MANAGER' or roleName == 'ADMIN'}">

	<div class="container px-4">

		<a th:href="@{/}"
			class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2">
			<i class="bi bi-cup-hot-fill fs-3 text-warning"></i> <span>UTETra</span>
		</a>

		<th:block th:if="${!isGuest}">
			<div class="ms-auto me-2 order-lg-3 ms-lg-2 me-lg-0">
				<div th:replace="~{fragments/notification-bell :: bell('light')}"></div>
			</div>
		</th:block>

		<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
			data-bs-target="#navbarMain" aria-controls="navbarMain"
			aria-expanded="false" aria-label="Mở menu">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse order-lg-2" id="navbarMain">

			<div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 w-100">

				<ul class="navbar-nav me-auto mb-2 mb-lg-0">

					<li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/}">
							<i class="bi bi-house-door me-1"></i> Trang chủ
					</a></li>

					<li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/menu}">
							<i class="bi bi-journal-richtext me-1"></i> Thực đơn
					</a></li>

					<li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/branches}">
							<i class="bi bi-shop me-1"></i> Chi nhánh
					</a></li>

				</ul>

				<div class="d-flex flex-column flex-lg-row align-items-lg-center gap-2">

					<a th:if="${isAdmin}" th:href="@{/admin/dashboard}"
						class="btn btn-warning btn-sm fw-bold"> <i
						class="bi bi-speedometer2 me-1"></i> Về trang quản trị
					</a>

					<a th:if="${isManager}" th:href="@{/manager/dashboard}"
						class="btn btn-warning btn-sm fw-bold"> <i
						class="bi bi-speedometer2 me-1"></i> Về trang quản lý
					</a>

					<a th:if="${isBuyer}" th:href="@{/orders}"
						class="btn btn-outline-light btn-sm fw-bold"> <i
						class="bi bi-receipt me-1"></i> Đơn hàng
					</a>

					<a th:if="${isBuyer}" th:href="@{/cart}"
						class="btn btn-light btn-sm fw-bold position-relative"> <i
						class="bi bi-cart3 me-1"></i> Giỏ hàng <span id="cart-count"
						class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
					</a>

					<span th:unless="${isBuyer}" id="cart-count" class="d-none">0</span>

					<div th:if="${!isGuest}" class="dropdown">

						<button
							class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center gap-2"
							type="button" data-bs-toggle="dropdown" aria-expanded="false">
							<i class="bi bi-person-circle fs-5"></i> <span
								th:text="${session.user.fullName != null and !#strings.isEmpty(session.user.fullName)
								         ? session.user.fullName : session.user.username}">Tài khoản</span>
						</button>

						<ul class="dropdown-menu dropdown-menu-end shadow">

							<th:block th:if="${isBuyer}">
								<li><a class="dropdown-item" th:href="@{/orders}">
										<i class="bi bi-receipt me-2"></i> Đơn hàng của tôi
								</a></li>
								<li><a class="dropdown-item" th:href="@{/cart}">
										<i class="bi bi-cart3 me-2"></i> Giỏ hàng
								</a></li>
								<li><a class="dropdown-item" th:href="@{/user/profile}">
										<i class="bi bi-person me-2"></i> Hồ sơ cá nhân
								</a></li>
								<li><a class="dropdown-item" th:href="@{/user/favorites}">
										<i class="bi bi-heart me-2"></i> Sản phẩm yêu thích
								</a></li>
								<li><a class="dropdown-item" th:href="@{/user/viewed}">
										<i class="bi bi-clock-history me-2"></i> Sản phẩm đã xem
								</a></li>
							</th:block>

							<th:block th:if="${isManager}">
								<li><a class="dropdown-item" th:href="@{/manager/dashboard}">
										<i class="bi bi-speedometer2 me-2"></i> Tổng quan chi nhánh
								</a></li>
								<li><a class="dropdown-item" th:href="@{/manager/orders}">
										<i class="bi bi-bell me-2"></i> Quầy đơn hàng
								</a></li>
							</th:block>

							<th:block th:if="${isAdmin}">
								<li><a class="dropdown-item" th:href="@{/admin/dashboard}">
										<i class="bi bi-speedometer2 me-2"></i> Trang quản trị
								</a></li>
							</th:block>

							<li><hr class="dropdown-divider"></li>

							<li>
								<form th:action="@{/auth/logout}" method="post" class="m-0">
									<button type="submit" class="dropdown-item text-danger">
										<i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
									</button>
								</form>
							</li>
						</ul>
					</div>

					<div th:if="${isGuest}" class="d-flex align-items-center gap-2">
						<a th:href="@{/auth/login}"
							class="btn btn-outline-light btn-sm fw-bold px-3"> <i
							class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
						</a> <a th:href="@{/auth/register}"
							class="btn btn-warning btn-sm fw-bold px-3"> <i
							class="bi bi-person-plus me-1"></i> Đăng ký
						</a>
					</div>

				</div>
			</div>
		</div>
	</div>
</header>

</html>
