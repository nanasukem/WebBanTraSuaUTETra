<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<header th:fragment="header"
	class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm py-2 sticky-top">

	<div class="container px-4">

		<!-- Logo -->
		<a th:href="@{/}"
			class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2">
			<i class="bi bi-cup-hot-fill fs-3 text-warning"></i> <span>UTETra</span>
		</a>

		<!-- Nút menu trên thiết bị nhỏ -->
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
			data-bs-target="#navbarMain" aria-controls="navbarMain"
			aria-expanded="false" aria-label="Mở menu">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarMain">

			<ul class="navbar-nav me-auto mb-2 mb-lg-0">
				<li class="nav-item"><a class="nav-link active fw-semibold"
					th:href="@{/menu}"> <i class="bi bi-journal-richtext me-1"></i>
						Thực đơn
				</a></li>
			</ul>

			<div class="d-flex align-items-center gap-3">

				<!-- Nút quản trị dành cho Admin/Manager -->
				<a
					th:if="${session.user != null
                            and session.user.role != null
                            and (session.user.role.name == 'ADMIN'
                            or session.user.role.name == 'MANAGER')}"
					th:href="@{/admin/products}" class="btn btn-warning btn-sm fw-bold">
					<i class="bi bi-speedometer2 me-1"></i> Quản trị Admin
				</a>

				<!-- Trường hợp đã đăng nhập -->
				<div th:if="${session.user != null}" class="dropdown">

					<button
						class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center gap-2"
						type="button" data-bs-toggle="dropdown" aria-expanded="false">

						<i class="bi bi-person-circle fs-5"></i> <span
							th:text="${session.user.fullName != null
                                        ? session.user.fullName
                                        : session.user.username}">
							User </span>
					</button>

					<ul class="dropdown-menu dropdown-menu-end shadow">
						<li><a class="dropdown-item" th:href="@{/user/profile}">
								<i class="bi bi-person me-2"></i> Hồ sơ cá nhân
						</a></li>

						<li><hr class="dropdown-divider"></li>

						<li><a class="dropdown-item text-danger"
							th:href="@{/auth/logout}"> <i
								class="bi bi-box-arrow-right me-2"></i> Đăng xuất
						</a></li>
					</ul>
				</div>

				<!-- Trường hợp chưa đăng nhập -->
				<div th:if="${session.user == null}" class="d-flex gap-2">

					<a th:href="@{/auth/login}"
						class="btn btn-outline-light btn-sm fw-bold px-3"> <i
						class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
					</a> <a th:href="@{/auth/register}"
						class="btn btn-warning btn-sm fw-bold px-3"> Đăng ký </a>
				</div>

			</div>
		</div>
	</div>
</header>

</html>
