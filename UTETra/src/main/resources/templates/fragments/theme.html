<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="assets(page)">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link th:href="@{/css/utetra/theme.css}" rel="stylesheet">
	<link th:if="${page != null}" th:href="@{/css/utetra/{p}.css(p=${page})}" rel="stylesheet">
</th:block>
</head>
<body>
	<th:block th:fragment="bootstrapJs">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script>
			document.querySelectorAll('[data-ut-toggle]').forEach(function (btn) {
				btn.addEventListener('click', function () {
					var target = document.getElementById(btn.getAttribute('data-ut-toggle'));
					if (!target) return;
					var open = target.classList.toggle('open');
					btn.setAttribute('aria-expanded', open ? 'true' : 'false');
					btn.querySelector('i').className = open ? 'bi bi-x-lg' : 'bi bi-list';
				});
			});
		</script>
	</th:block>
</body>
</html>
