<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="assets(page)">
	<meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
	<meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
	<script>
		(function () {
			var tokenMeta = document.querySelector('meta[name="_csrf"]');
			var headerMeta = document.querySelector('meta[name="_csrf_header"]');
			if (!tokenMeta || !headerMeta || !window.fetch) return;
			var token = tokenMeta.content;
			var headerName = headerMeta.content;
			var originalFetch = window.fetch;
			window.fetch = function (input, init) {
				init = init || {};
				var method = (init.method || (input && input.method) || 'GET').toUpperCase();
				var url = typeof input === 'string' ? input : (input && input.url) || '';
				var sameOrigin = !/^https?:/i.test(url) || url.indexOf(location.origin) === 0;
				if (sameOrigin && method !== 'GET' && method !== 'HEAD') {
					var headers = new Headers(init.headers || (input && input.headers) || {});
					if (!headers.has(headerName)) headers.set(headerName, token);
					init = Object.assign({}, init, { headers: headers });
				}
				return originalFetch.call(this, input, init);
			};
		})();
	</script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link th:href="@{/css/utetra/theme.css}" rel="stylesheet">
	<link th:if="${page != null}" th:href="@{/css/utetra/{p}.css(p=${page})}" rel="stylesheet">
</th:block>
</head>
<body>
	<th:block th:fragment="bootstrapJs">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script>
			document.querySelectorAll('[data-ut-toggle]').forEach(function (btn) {
				btn.addEventListener('click', function () {
					var target = document.getElementById(btn.getAttribute('data-ut-toggle'));
					if (!target) return;
					var open = target.classList.toggle('open');
					btn.setAttribute('aria-expanded', open ? 'true' : 'false');
					btn.querySelector('i').className = open ? 'bi bi-x-lg' : 'bi bi-list';
				});
			});
		</script>
	</th:block>
</body>
</html>
