<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="filter(url, range, years, branchId)" class="d-flex flex-column gap-2">
		<div class="d-flex flex-wrap gap-2 align-items-center">
			<a th:each="q : ${ {'TODAY', 'MONTH', 'YEAR', 'ALL'} }"
				th:href="${branchId == null} ? @{${url}(period=${q})} : @{${url}(period=${q}, branchId=${branchId})}" class="btn btn-sm rounded-pill"
				th:classappend="${range.period() == q} ? 'btn-success' : 'btn-outline-secondary'"
				th:text="${q == 'TODAY'} ? 'Hôm nay' : (${q == 'MONTH'} ? 'Tháng này' : (${q == 'YEAR'} ? 'Năm nay' : 'Tất cả'))">Hôm nay</a>
		</div>
		<div class="d-flex flex-wrap gap-2 align-items-end">
			<form th:action="@{${url}}" method="get" class="d-flex gap-1 align-items-end">
				<input type="hidden" name="branchId" th:if="${branchId != null}" th:value="${branchId}">
				<div>
					<label class="form-label small text-muted mb-0">Theo tháng</label>
					<input type="month" name="month" class="form-control form-control-sm" th:value="${range.month()}" required>
				</div>
				<button class="btn btn-sm btn-outline-success" type="submit">Xem</button>
			</form>
			<form th:action="@{${url}}" method="get" class="d-flex gap-1 align-items-end">
				<input type="hidden" name="branchId" th:if="${branchId != null}" th:value="${branchId}">
				<div>
					<label class="form-label small text-muted mb-0">Theo năm</label>
					<select name="year" class="form-select form-select-sm">
						<option th:each="y : ${years}" th:value="${y}" th:text="${y}"
							th:selected="${range.year() != null and range.year() == y}">2026</option>
					</select>
				</div>
				<button class="btn btn-sm btn-outline-success" type="submit">Xem</button>
			</form>
			<form th:action="@{${url}}" method="get" class="d-flex gap-1 align-items-end flex-wrap">
				<input type="hidden" name="branchId" th:if="${branchId != null}" th:value="${branchId}">
				<div>
					<label class="form-label small text-muted mb-0">Từ ngày</label>
					<input type="date" name="from" class="form-control form-control-sm"
						th:value="${range.period() == 'CUSTOM'} ? ${range.from()}" required>
				</div>
				<div>
					<label class="form-label small text-muted mb-0">Đến ngày</label>
					<input type="date" name="to" class="form-control form-control-sm"
						th:value="${range.period() == 'CUSTOM'} ? ${range.to()}" required>
				</div>
				<button class="btn btn-sm btn-outline-success" type="submit">Xem</button>
			</form>
		</div>
		<div class="small">Đang xem: <b class="text-success" th:text="${range.label()}">Tháng 10/2026</b></div>
	</div>
</body>
</html>
