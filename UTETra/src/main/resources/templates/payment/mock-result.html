<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kết quả thanh toán - UTETra</title>

<meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
<meta name="_csrf_header"
	th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: #f5f7f8;
	font-family: Arial, sans-serif;
}

.result-card {
	max-width: 620px;
	margin: 55px auto;
	padding: 32px;
	background: #fff;
	border-radius: 18px;
	box-shadow: 0 5px 24px rgba(0, 0, 0, .08);
}

.result-icon {
	width: 78px;
	height: 78px;
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	margin: 0 auto 18px;
	font-size: 42px;
	font-weight: bold;
}

.success-icon {
	color: #198754;
	background: #e8f6ee;
}

.failure-icon {
	color: #dc3545;
	background: #fbeaec;
}

.detail-row {
	display: flex;
	justify-content: space-between;
	align-items: flex-start;
	gap: 16px;
	padding: 12px 0;
	border-bottom: 1px solid #eee;
}

.detail-label {
	color: #6c757d;
	flex-shrink: 0;
}

.detail-value {
	text-align: right;
	font-weight: 600;
	overflow-wrap: anywhere;
}

.btn {
	padding: 11px 16px;
	font-weight: 600;
}

@media ( max-width : 576px) {
	.result-card {
		margin: 24px auto;
		padding: 22px 18px;
	}
	.detail-row {
		gap: 10px;
	}
}
</style>
</head>

<body>

	<div class="container px-3">
		<div class="result-card">

			<!-- Thanh toán thành công -->
			<div th:if="${success}" class="text-center">
				<div class="result-icon success-icon">✓</div>
				<h2 class="text-success fw-bold">Thanh toán thành công</h2>
			</div>

			<!-- Thanh toán thất bại hoặc đơn hàng đã hủy -->
			<div th:unless="${success}" class="text-center">
				<div class="result-icon failure-icon">×</div>

				<h2 class="text-danger fw-bold"
					th:if="${order.status != null and order.status.name() == 'CANCELLED'}">
					Đơn hàng đã bị hủy</h2>

				<h2 class="text-danger fw-bold"
					th:unless="${order.status != null and order.status.name() == 'CANCELLED'}">
					Thanh toán thất bại</h2>
			</div>

			<p class="text-center text-secondary mt-3 mb-4" th:text="${message}">
				Kết quả giao dịch</p>

			<!-- Mã đơn hàng -->
			<div class="detail-row">
				<span class="detail-label">Mã đơn hàng</span> <span
					class="detail-value" th:text="${'#' + order.id}">#1</span>
			</div>

			<!-- Số tiền -->
			<div class="detail-row">
				<span class="detail-label">Số tiền</span> <span
					class="detail-value text-danger"
					th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA') + 'đ'}">
					160.000đ </span>
			</div>

			<!-- Phương thức thanh toán -->
			<div class="detail-row">
				<span class="detail-label">Phương thức</span> <span
					class="detail-value">VNPAY (mô phỏng)</span>
			</div>

			<!-- Mã giao dịch nếu có -->
			<div class="detail-row"
				th:if="${payment != null and payment.transactionCode != null and !#strings.isEmpty(payment.transactionCode)}">
				<span class="detail-label">Mã giao dịch</span> <span
					class="detail-value" th:text="${payment.transactionCode}">
					UT-XXXXXXXX </span>
			</div>

			<!-- Trạng thái thanh toán -->
			<div class="detail-row">
				<span class="detail-label">Trạng thái thanh toán</span> <span
					class="detail-value" th:text="${order.paymentStatus}">
					UNPAID </span>
			</div>

			<!-- Trạng thái đơn hàng -->
			<div class="detail-row">
				<span class="detail-label">Trạng thái đơn hàng</span> <span
					class="detail-value" th:text="${order.status}"> PENDING </span>
			</div>

			<div class="mt-4 d-grid gap-2">

				<!-- Thành công: xem chi tiết đơn hàng -->
				<a th:if="${success}"
					th:href="@{/checkout/success/{id}(id=${order.id})}"
					class="btn btn-success"> Xem đơn hàng </a>

				<!-- Thất bại: quay lại checkout nếu đơn chưa bị hủy và chưa thanh toán -->
				<button
					th:if="${!success
                            and order.status.name() != 'CANCELLED'
                            and order.paymentStatus.name() != 'PAID'}"
					type="button" id="btn-return-checkout" class="btn btn-success">
					Quay lại trang thanh toán</button>

				<!-- Đơn đã hủy hoặc đã thanh toán: đặt đơn mới -->
				<a
					th:if="${!success
                       and (order.status.name() == 'CANCELLED'
                            or order.paymentStatus.name() == 'PAID')}"
					th:href="@{/menu}" class="btn btn-success"> Đặt đơn hàng mới </a>

				<!-- Luôn có lựa chọn quay về thực đơn -->
				<a th:href="@{/menu}" class="btn btn-outline-secondary"> Về thực
					đơn </a>

			</div>

			<div id="error-message" class="alert alert-danger mt-3 d-none"
				role="alert"></div>

		</div>
	</div>

	<script th:inline="javascript">
		const returnButton = document.getElementById('btn-return-checkout');
		const errorBox = document.getElementById('error-message');

		if (returnButton) {
			returnButton.addEventListener('click', function() {
				this.disabled = true;
				this.textContent = 'Đang chuyển trang...';

				if (errorBox) {
					errorBox.classList.add('d-none');
					errorBox.textContent = '';
				}

				// Đơn VNPAY chưa thanh toán không xóa giỏ hàng ở server.
				// Vì vậy chỉ cần quay lại trang checkout.
				window.location.href = '/checkout';
			});
		}
	</script>

</body>
</html>
