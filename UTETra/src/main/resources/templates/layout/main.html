
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:fragment="main(title, content)">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title th:text="${title}">UTETra</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
	rel="stylesheet">

<style>
body {
	font-family: Arial, sans-serif;
	color: #212529;
}

main {
	min-height: 65vh;
}

.site-footer {
	background: #212529;
	color: #fff;
	margin-top: auto;
}

.site-footer a {
	color: #dee2e6;
	text-decoration: none;
}

.site-footer a:hover {
	color: #fff;
}
</style>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<!-- Header -->
	<div th:replace="~{fragments/header :: header}"></div>

	<!-- Nội dung trang -->
	<main class="container py-4 flex-grow-1">
		<div th:replace="${content}"></div>
	</main>

	<!-- Footer -->
	<footer class="site-footer py-4">
		<div class="container">
			<div class="row g-3">
				<div class="col-md-6">
					<h5 class="fw-bold">
						<i class="bi bi-shop"></i> UTETra
					</h5>
					<p class="mb-0">Hệ thống đặt món và mua sắm tại các chi nhánh
						UTETra.</p>
				</div>

				<div class="col-md-6 text-md-end">
					<a th:href="@{/}">Trang chủ</a> <span class="mx-2">|</span> <a
						th:href="@{/menu}">Thực đơn</a>
					<p class="small mt-2 mb-0">© 2026 UTETra. All rights reserved.
					</p>
				</div>
			</div>
		</div>
	</footer>

	<!-- JavaScript -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/cart.js}"></script>

	<!-- CUỘN MƯỢT: link tới 1 khối trên CHÍNH trang đang mở (vd #ban-chay, /menu#san-pham-moi) thì cuộn mượt, không tải lại -->
	<script>
		document.addEventListener('click', function (e) {
			const a = e.target.closest('a[href*="#"]');
			if (!a) return;
			const url = new URL(a.href, window.location.href);
			if (!url.hash || url.pathname !== location.pathname || url.search !== location.search) return;
			const target = document.querySelector(url.hash);
			if (!target) return;
			e.preventDefault();
			target.scrollIntoView({ behavior: 'smooth', block: 'start' });
			history.replaceState(null, '', url.pathname + url.search + url.hash);
		});
	</script>

</body>
</html>
