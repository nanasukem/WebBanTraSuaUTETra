<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="main(title, content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">UTETra System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- HEADER DÙNG CHUNG -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- NỘI DUNG TỪNG TRANG -->
    <main class="container py-4 flex-grow-1">
        <div th:replace="${content}"></div>
    </main>

    <!-- FOOTER DÙNG CHUNG -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- GIỎ HÀNG: modal chọn món + badge số ly + trang giỏ (phải nạp SAU Bootstrap JS) -->
    <script th:src="@{/js/cart.js}"></script>

    <!-- CUỘN MƯỢT: link dạng /menu#thuc-don khi đang ở đúng trang đó thì cuộn mượt, không tải lại -->
    <script>
        document.addEventListener('click', function (e) {
            const a = e.target.closest('a[href*="#"]');
            if (!a) return;
            const url = new URL(a.href, window.location.href);
            // Chỉ xử lý khi link trỏ tới CHÍNH trang đang mở (cùng đường dẫn + cùng bộ lọc)
            if (!url.hash || url.pathname !== location.pathname || url.search !== location.search) return;
            const target = document.querySelector(url.hash);
            if (!target) return;
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState(null, '', url.pathname + url.search + url.hash);
        });
    </script>

</body>
</html>
