<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="main(title, content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">UTETra System</title>

    <th:block th:replace="~{fragments/theme :: assets(null)}"></th:block>

</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4 flex-grow-1">
        <div th:replace="${content}"></div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <th:block th:replace="~{fragments/theme :: bootstrapJs}"></th:block>

    <script th:src="@{/js/cart.js}"></script>

    <script>
        document.addEventListener('click', function (e) {
            const a = e.target.closest('a[href*="#"]');
            if (!a) return;
            const url = new URL(a.href, window.location.href);
            if (!url.hash || url.pathname !== location.pathname || url.search !== location.search) return;
            const target = document.querySelector(url.hash);
            if (!target) return;
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState(null, '', url.pathname + url.search + url.hash);
        });
    </script>

	<th:block th:if="${session.user != null}"><th:block th:replace="~{fragments/notification-bell :: scripts}"></th:block></th:block>
</body>
</html>
