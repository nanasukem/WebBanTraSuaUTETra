<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:fragment="main(title, content)">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title th:text="${title}">UTETra - Tài khoản</title>

<!-- Bootstrap 5 -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<!-- CSS dùng chung cho các trang xác thực -->
<style>
body {
	background-color: #f8f9fa;
}

.auth-card {
	width: 100%;
	max-width: 420px;
	border-radius: 1rem;
	border: none;
}

.auth-card.auth-register {
	max-width: 480px;
}

.btn-success {
	background-color: #198754;
	border: none;
}

.btn-success:hover {
	background-color: #146c43;
}

.otp-input {
	letter-spacing: 8px;
	font-size: 1.5rem;
	text-align: center;
}
</style>
</head>

<body class="d-flex flex-column min-vh-100">

	<!-- Header dùng chung -->
	<div th:replace="~{fragments/auth-header :: authHeader(${title})}"></div>

	<!-- Nội dung từng trang -->
	<main
		class="flex-grow-1 d-flex align-items-center justify-content-center py-4">
		<div th:replace="${content}"></div>
	</main>

	<!-- Footer dùng chung -->
	<div th:replace="~{fragments/footer :: footer}"></div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
