<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:fragment="main(title, content)">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title th:text="${title}">UTETra - Tài khoản</title>

<th:block th:replace="~{fragments/theme :: assets('auth')}"></th:block>


</head>

<body class="d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/auth-header :: authHeader(${title})}"></div>

	<main
		class="flex-grow-1 d-flex align-items-center justify-content-center py-4">
		<div th:replace="${content}"></div>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<th:block th:replace="~{fragments/theme :: bootstrapJs}"></th:block>

</body>
</html>
