<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:fragment="main(title, activePage, content)">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title th:text="${title} + ' - Quản trị UTETra'">Quản trị UTETra
</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
	rel="stylesheet">

<style>
html, body {
	margin: 0;
	padding: 0;
	min-height: 100%;
}

body {
	background: #f7f9f8;
	color: #26352d;
}

/* =========================
           ADMIN HEADER
           ========================= */
.admin-header {
	height: 76px;
	background: #198754;
	display: flex;
	align-items: center;
	padding: 0 40px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.admin-brand {
	display: flex;
	align-items: center;
	gap: 10px;
	color: #ffffff;
	text-decoration: none;
	font-size: 25px;
	font-weight: 700;
}

.admin-brand-icon {
	color: #ffc107;
	font-size: 28px;
}

.admin-menu {
	display: flex;
	align-items: center;
	margin-left: 32px;
}

.admin-menu a {
	display: flex;
	align-items: center;
	gap: 8px;
	color: #ffffff;
	text-decoration: none;
	font-size: 15px;
	font-weight: 500;
	padding: 9px 14px;
	border-radius: 8px;
	transition: 0.2s;
}

.admin-menu a:hover {
	background: rgba(255, 255, 255, 0.12);
}

/* Menu "Quản lý" thả xuống: chữ tối trên nền trắng (không ăn style chữ trắng của .admin-menu a) */
.admin-menu .dropdown-toggle {
	background: transparent;
	border: 0;
	color: #ffffff;
	font-size: 15px;
	font-weight: 500;
	padding: 9px 14px;
	border-radius: 8px;
	display: flex;
	align-items: center;
	gap: 8px;
}

.admin-menu .dropdown-toggle:hover, .admin-menu .dropdown-toggle.show {
	background: rgba(255, 255, 255, 0.12);
}

.admin-menu .dropdown-menu a {
	color: #26352d;
	font-weight: 400;
	border-radius: 0;
	padding: 8px 16px;
	gap: 10px;
}

.admin-menu .dropdown-menu a:hover {
	background: #e9f5ee;
	color: #146c43;
}

.admin-actions {
	margin-left: auto;
	display: flex;
	align-items: center;
	gap: 10px;
}

.admin-user {
	display: flex;
	align-items: center;
	gap: 8px;
	color: #ffffff;
	font-size: 14px;
	font-weight: 600;
	padding: 8px 13px;
	border: 1px solid rgba(255, 255, 255, 0.35);
	border-radius: 8px;
	text-decoration: none;
}

.admin-user:hover {
	color: #ffffff;
	background: rgba(255, 255, 255, 0.12);
}

.admin-logout {
	display: flex;
	align-items: center;
	gap: 7px;
	color: #ffffff;
	background: transparent;
	border: 1px solid rgba(255, 255, 255, 0.35);
	padding: 8px 13px;
	border-radius: 8px;
	text-decoration: none;
	font-size: 14px;
	transition: 0.2s;
}

.admin-logout:hover {
	color: #ffffff;
	background: rgba(255, 255, 255, 0.12);
}

/* =========================
           MAIN
           ========================= */
.admin-main {
	width: 100%;
	flex: 1 1 auto;
	min-width: 0;
	padding: 28px 32px;
	overflow-x: hidden;
}

.admin-content {
	width: 100%;
	max-width: 1600px;
	margin: 0 auto;
}

/* =========================
           FOOTER
           ========================= */
.admin-footer {
	background: #ffffff;
	border-top: 1px solid #e5ebe7;
	color: #7a8780;
	text-align: center;
	font-size: 13px;
	padding: 14px 20px;
}

/* =========================
           RESPONSIVE
           ========================= */
@media ( max-width : 768px) {
	.admin-header {
		padding: 0 18px;
	}
	.admin-brand {
		font-size: 21px;
	}
	.admin-menu {
		margin-left: 12px;
	}
	.admin-menu a {
		padding: 8px;
	}
	.admin-menu span {
		display: none;
	}
	.admin-user span {
		display: none;
	}
	.admin-main {
		padding: 22px 18px;
	}
}

@media ( max-width : 480px) {
	.admin-header {
		height: 68px;
		padding: 0 14px;
	}
	.admin-brand-icon {
		font-size: 24px;
	}
	.admin-brand {
		font-size: 19px;
	}
	.admin-menu {
		margin-left: 5px;
	}
	.admin-logout {
		padding: 7px 9px;
	}
	.admin-main {
		padding: 18px 12px;
	}
}
</style>
</head>


<body class="d-flex flex-column min-vh-100">


	<!-- =========================
     HEADER ADMIN (quản lý toàn hệ thống)
     ========================= -->
	<header class="admin-header">

		<!-- Logo -->
		<a th:href="@{/admin/dashboard}" class="admin-brand"> <i
			class="bi bi-cup-hot-fill admin-brand-icon"></i> <span>UTETra</span>

		</a>


		<!-- Menu: Tổng quan + "Quản lý" (các chức năng Admin theo đề) + Thực đơn -->
		<nav class="admin-menu">

			<a th:href="@{/admin/dashboard}"> <i class="bi bi-speedometer2"></i> <span>Tổng quan</span></a>

			<div class="dropdown">
				<button class="dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
					<i class="bi bi-grid"></i> <span>Quản lý</span>
				</button>
				<ul class="dropdown-menu shadow">
					<li><a class="dropdown-item d-flex align-items-center" th:href="@{/admin/users}">
						<i class="bi bi-people"></i> Người dùng</a></li>
					<li><a class="dropdown-item d-flex align-items-center" th:href="@{/admin/products}">
						<i class="bi bi-cup-straw"></i> Sản phẩm</a></li>
					<li><a class="dropdown-item d-flex align-items-center" th:href="@{/admin/categories}">
						<i class="bi bi-tags"></i> Danh mục</a></li>
					<li><a class="dropdown-item d-flex align-items-center" th:href="@{/admin/branches}">
						<i class="bi bi-shop"></i> Chi nhánh</a></li>
					<li><a class="dropdown-item d-flex align-items-center" th:href="@{/admin/vouchers}">
						<i class="bi bi-ticket-perforated"></i> Khuyến mãi</a></li>
					<li><a class="dropdown-item d-flex align-items-center" th:href="@{/admin/carriers}">
						<i class="bi bi-truck"></i> Đối tác giao hàng</a></li>
					<li><hr class="dropdown-divider"></li>
					<li><a class="dropdown-item d-flex align-items-center" th:href="@{/admin/orders}">
						<i class="bi bi-receipt"></i> Đơn hàng</a></li>
					<li><a class="dropdown-item d-flex align-items-center" th:href="@{/admin/reports}">
						<i class="bi bi-graph-up-arrow"></i> Doanh thu &amp; báo cáo</a></li>
				</ul>
			</div>

			<a th:href="@{/menu}"> <i class="bi bi-journal-text"></i> <span>Thực
					đơn</span>

			</a>

		</nav>

		<!-- Tài khoản admin -->
		<div class="admin-actions">

			<!-- Chuông thông báo -->
			<div th:replace="~{fragments/notification-bell :: bell('admin')}"></div>

			<a href="#" class="admin-user"> <i class="bi bi-person-gear"></i>
				<span>Quản trị viên</span>
			</a>

			<!-- Đăng xuất -->
			<form th:action="@{/auth/logout}" method="post" class="m-0">

				<button type="submit" class="admin-logout">
					<i class="bi bi-box-arrow-right"></i> <span>Đăng xuất</span>
				</button>

			</form>

		</div>

	</header>


	<!-- =========================
     NỘI DUNG ADMIN
     ========================= -->
	<main class="admin-main">

		<div class="admin-content">

			<th:block th:replace="${content}">
			</th:block>

		</div>

	</main>


	<!-- =========================
     FOOTER
     ========================= -->
	<footer class="admin-footer"> © 2026 UTETra - Hệ thống quản
		trị </footer>


	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
		
	</script>

	<!-- Chuông thông báo (chỉ khi đã đăng nhập) -->
	<th:block th:if="${session.user != null}"><th:block th:replace="~{fragments/notification-bell :: scripts}"></th:block></th:block>
</body>
</html>
