<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:fragment="main(title, activePage, content)">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title th:text="${title} + ' - Quản trị UTETra'">Quản trị UTETra
</title>

<th:block th:replace="~{fragments/theme :: assets('admin')}"></th:block>


</head>

<body class="d-flex flex-column min-vh-100">

	<header class="admin-header">

		<a th:href="@{/admin/dashboard}" class="admin-brand"> <i
			class="bi bi-cup-hot-fill admin-brand-icon"></i> <span>UTETra</span>

		</a>

		<div class="admin-collapse" id="adminNav">

		<nav class="admin-menu">

			<a th:href="@{/admin/dashboard}"> <i class="bi bi-speedometer2"></i>
				<span>Tổng quan</span></a>

			<div class="dropdown">
				<button class="dropdown-toggle" type="button"
					data-bs-toggle="dropdown" aria-expanded="false">
					<i class="bi bi-grid"></i> <span>Quản lý</span>
				</button>
				<ul class="dropdown-menu shadow">
					<li><a class="dropdown-item d-flex align-items-center"
						th:href="@{/admin/users}"> <i class="bi bi-people"></i> Tài
							khoản
					</a></li>
					<li><a class="dropdown-item d-flex align-items-center"
						th:href="@{/admin/products}"> <i class="bi bi-cup-straw"></i>
							Sản phẩm
					</a></li>
					<li><a class="dropdown-item d-flex align-items-center"
						th:href="@{/admin/categories}"> <i class="bi bi-tags"></i>
							Danh mục
					</a></li>
					<li><a class="dropdown-item d-flex align-items-center"
						th:href="@{/admin/branches}"> <i class="bi bi-shop"></i> Chi
							nhánh
					</a></li>
					<li><a class="dropdown-item d-flex align-items-center"
						th:href="@{/admin/shipping-fee}"> <i class="bi bi-truck"></i> Phí giao hàng
					</a></li>
					<li><a class="dropdown-item d-flex align-items-center"
						th:href="@{/admin/vouchers}"> <i
							class="bi bi-ticket-perforated"></i> Khuyến mãi
					</a></li>
					<li><a class="dropdown-item d-flex align-items-center"
						th:href="@{/admin/reviews}"> <i class="bi bi-star"></i> Đánh
							giá
					</a></li>
					<li><hr class="dropdown-divider"></li>
					<li><a class="dropdown-item d-flex align-items-center"
						th:href="@{/admin/orders}"> <i class="bi bi-receipt"></i> Đơn
							hàng
					</a></li>
					<li><a class="dropdown-item d-flex align-items-center"
						th:href="@{/admin/reports}"> <i class="bi bi-graph-up-arrow"></i>
							Doanh thu &amp; báo cáo
					</a></li>
					<li><a class="dropdown-item d-flex align-items-center"
						th:href="@{/admin/activity-logs}"> <i class="bi bi-journal-text"></i> Nhật ký hoạt động
					</a></li>
				</ul>
			</div>

			<a th:href="@{/menu}"> <i class="bi bi-journal-text"></i> <span>Thực
					đơn</span>

			</a>

		</nav>

		<div class="admin-actions">

			<a th:href="@{/account}" class="admin-user" title="Tài khoản của tôi"> <i class="bi bi-person-gear"></i>
				<span>Quản trị viên</span>
			</a>

			<form th:action="@{/auth/logout}" method="post" class="m-0">

				<button type="submit" class="admin-logout">
					<i class="bi bi-box-arrow-right"></i> <span>Đăng xuất</span>
				</button>

			</form>

		</div>

		</div>

		<div class="admin-bell">
			<div th:replace="~{fragments/notification-bell :: bell('admin')}"></div>
		</div>

		<button type="button" class="admin-toggle" data-ut-toggle="adminNav" aria-controls="adminNav"
			aria-expanded="false" aria-label="Mở menu">
			<i class="bi bi-list"></i>
		</button>

	</header>

	<main class="admin-main">

		<div class="admin-content">

			<th:block th:replace="${content}">
			</th:block>

		</div>

	</main>

	<footer class="admin-footer"> © 2026 UTETra - Hệ thống quản
		trị </footer>

	<th:block th:replace="~{fragments/theme :: bootstrapJs}"></th:block>

	<th:block th:if="${session.user != null}">
		<th:block th:replace="~{fragments/notification-bell :: scripts}"></th:block>
	</th:block>
</body>
</html>
