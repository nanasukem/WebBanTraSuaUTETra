<!DOCTYPE html>
<!--
	Layout riêng cho khu MANAGER (/manager/**): thanh menu của Manager + màu xanh lá.
	Tách khỏi admin-layout để giao diện Admin và Manager đổi độc lập với nhau.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:fragment="main(title, activePage, content)">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title th:text="${title} + ' - Quản lý chi nhánh UTETra'">Quản lý chi nhánh UTETra
</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
	rel="stylesheet">

<style>
html, body {
	margin: 0;
	padding: 0;
	min-height: 100%;
}

body {
	background: #f7f9f8;
	color: #26352d;
}

/* =========================
           ADMIN HEADER
           ========================= */
.admin-header {
	height: 76px;
	background: #198754;
	display: flex;
	align-items: center;
	padding: 0 40px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.admin-brand {
	display: flex;
	align-items: center;
	gap: 10px;
	color: #ffffff;
	text-decoration: none;
	font-size: 25px;
	font-weight: 700;
}

.admin-brand-icon {
	color: #ffc107;
	font-size: 28px;
}

.admin-menu {
	display: flex;
	align-items: center;
	margin-left: 32px;
}

.admin-menu a {
	display: flex;
	align-items: center;
	gap: 8px;
	color: #ffffff;
	text-decoration: none;
	font-size: 15px;
	font-weight: 500;
	padding: 9px 14px;
	border-radius: 8px;
	transition: 0.2s;
}

.admin-menu a:hover {
	background: rgba(255, 255, 255, 0.12);
}

.admin-actions {
	margin-left: auto;
	display: flex;
	align-items: center;
	gap: 10px;
}

.admin-user {
	display: flex;
	align-items: center;
	gap: 8px;
	color: #ffffff;
	font-size: 14px;
	font-weight: 600;
	padding: 8px 13px;
	border: 1px solid rgba(255, 255, 255, 0.35);
	border-radius: 8px;
	text-decoration: none;
}

.admin-user:hover {
	color: #ffffff;
	background: rgba(255, 255, 255, 0.12);
}

.admin-logout {
	display: flex;
	align-items: center;
	gap: 7px;
	color: #ffffff;
	background: transparent;
	border: 1px solid rgba(255, 255, 255, 0.35);
	padding: 8px 13px;
	border-radius: 8px;
	text-decoration: none;
	font-size: 14px;
	transition: 0.2s;
}

.admin-logout:hover {
	color: #ffffff;
	background: rgba(255, 255, 255, 0.12);
}

/* =========================
           MAIN
           ========================= */
.admin-main {
	width: 100%;
	flex: 1 1 auto;
	min-width: 0;
	padding: 28px 32px;
	overflow-x: hidden;
}

.admin-content {
	width: 100%;
	max-width: 1600px;
	margin: 0 auto;
}

/* =========================
           FOOTER
           ========================= */
.admin-footer {
	background: #ffffff;
	border-top: 1px solid #e5ebe7;
	color: #7a8780;
	text-align: center;
	font-size: 13px;
	padding: 14px 20px;
}

/* =========================
           RESPONSIVE
           ========================= */
@media ( max-width : 768px) {
	.admin-header {
		padding: 0 18px;
	}
	.admin-brand {
		font-size: 21px;
	}
	.admin-menu {
		margin-left: 12px;
	}
	.admin-menu a {
		padding: 8px;
	}
	.admin-menu span {
		display: none;
	}
	.admin-user span {
		display: none;
	}
	.admin-main {
		padding: 22px 18px;
	}
}

@media ( max-width : 480px) {
	.admin-header {
		height: 68px;
		padding: 0 14px;
	}
	.admin-brand-icon {
		font-size: 24px;
	}
	.admin-brand {
		font-size: 19px;
	}
	.admin-menu {
		margin-left: 5px;
	}
	.admin-logout {
		padding: 7px 9px;
	}
	.admin-main {
		padding: 18px 12px;
	}
}

/* =========================
   MANAGER: đổi màu xanh dương (primary, info) của Bootstrap sang xanh lá
   (body luôn có class manager-theme)
   ========================= */
.manager-theme {
	--bs-primary: #198754;
	--bs-primary-rgb: 25, 135, 84;
	--bs-primary-text-emphasis: #0a3622;
	--bs-primary-bg-subtle: #d1e7dd;
	--bs-primary-border-subtle: #a3cfbb;
	--bs-info: #20c997;
	--bs-info-rgb: 32, 201, 151;
	--bs-info-text-emphasis: #0b5d47;
	--bs-info-bg-subtle: #d2f4ea;
	--bs-info-border-subtle: #a6e9d5;
	--bs-link-color: #198754;
	--bs-link-color-rgb: 25, 135, 84;
	--bs-link-hover-color: #146c43;
	--bs-link-hover-color-rgb: 20, 108, 67;
}

.manager-theme .btn-primary {
	--bs-btn-bg: #198754;
	--bs-btn-border-color: #198754;
	--bs-btn-hover-bg: #157347;
	--bs-btn-hover-border-color: #146c43;
	--bs-btn-active-bg: #146c43;
	--bs-btn-active-border-color: #13653f;
	--bs-btn-disabled-bg: #198754;
	--bs-btn-disabled-border-color: #198754;
	--bs-btn-focus-shadow-rgb: 60, 153, 110;
}

.manager-theme .btn-outline-primary {
	--bs-btn-color: #198754;
	--bs-btn-border-color: #198754;
	--bs-btn-hover-color: #fff;
	--bs-btn-hover-bg: #198754;
	--bs-btn-hover-border-color: #198754;
	--bs-btn-active-color: #fff;
	--bs-btn-active-bg: #198754;
	--bs-btn-active-border-color: #198754;
	--bs-btn-disabled-color: #198754;
	--bs-btn-disabled-border-color: #198754;
	--bs-btn-focus-shadow-rgb: 25, 135, 84;
}

.manager-theme .btn-info {
	--bs-btn-color: #fff;
	--bs-btn-bg: #20c997;
	--bs-btn-border-color: #20c997;
	--bs-btn-hover-color: #fff;
	--bs-btn-hover-bg: #1aa179;
	--bs-btn-hover-border-color: #1aa179;
	--bs-btn-active-color: #fff;
	--bs-btn-active-bg: #1aa179;
	--bs-btn-active-border-color: #1aa179;
}

.manager-theme .btn-outline-info {
	--bs-btn-color: #1aa179;
	--bs-btn-border-color: #20c997;
	--bs-btn-hover-color: #fff;
	--bs-btn-hover-bg: #20c997;
	--bs-btn-hover-border-color: #20c997;
	--bs-btn-active-color: #fff;
	--bs-btn-active-bg: #20c997;
	--bs-btn-active-border-color: #20c997;
}

.manager-theme .form-control:focus,
.manager-theme .form-select:focus,
.manager-theme .form-check-input:focus {
	border-color: #75b798;
	box-shadow: 0 0 0 .25rem rgba(25, 135, 84, .25);
}

.manager-theme .form-check-input:checked {
	background-color: #198754;
	border-color: #198754;
}

.manager-theme .pagination {
	--bs-pagination-color: #198754;
	--bs-pagination-hover-color: #146c43;
	--bs-pagination-focus-color: #146c43;
	--bs-pagination-focus-box-shadow: 0 0 0 .25rem rgba(25, 135, 84, .25);
	--bs-pagination-active-bg: #198754;
	--bs-pagination-active-border-color: #198754;
}
</style>
</head>


<body class="d-flex flex-column min-vh-100 manager-theme">


	<!-- =========================
     HEADER MANAGER
     ========================= -->
	<header class="admin-header">

		<!-- Logo: về Tổng quan chi nhánh -->
		<a th:href="@{/manager/dashboard}" class="admin-brand"> <i
			class="bi bi-cup-hot-fill admin-brand-icon"></i> <span>UTETra</span>

		</a>


		<!-- Menu: các mục dùng nhiều nhất.
		     Món, Voucher, Khách hàng, Báo cáo vào từ các nút trên trang Tổng quan.
		     Thực đơn = trang của khách; ở đó có nút vàng "Về trang quản lý" để quay lại -->
		<nav class="admin-menu">
			<a th:href="@{/manager/dashboard}"> <i class="bi bi-speedometer2"></i> <span>Tổng quan</span></a>
			<a th:href="@{/manager/orders}"> <i class="bi bi-bell"></i> <span>Quầy đơn hàng</span></a>
			<a th:href="@{/menu}"> <i class="bi bi-journal-text"></i> <span>Thực đơn</span></a>
		</nav>

		<!-- Tài khoản manager -->
		<div class="admin-actions">

			<!-- Chuông thông báo -->
			<div th:replace="~{fragments/notification-bell :: bell('admin')}"></div>

			<a th:href="@{/account}" class="admin-user" title="Tài khoản của tôi"> <i class="bi bi-person-gear"></i>
				<span th:text="${session.user != null and session.user.fullName != null} ? ${session.user.fullName} : 'Quản lý chi nhánh'">Quản lý chi nhánh</span>
			</a>

			<!-- Đăng xuất -->
			<form th:action="@{/auth/logout}" method="post" class="m-0">

				<button type="submit" class="admin-logout">
					<i class="bi bi-box-arrow-right"></i> <span>Đăng xuất</span>
				</button>

			</form>

		</div>

	</header>


	<!-- =========================
     NỘI DUNG MANAGER
     ========================= -->
	<main class="admin-main">

		<div class="admin-content">

			<th:block th:replace="${content}">
			</th:block>

		</div>

	</main>


	<!-- =========================
     FOOTER
     ========================= -->
	<footer class="admin-footer"> © 2026 UTETra - Quản lý chi nhánh </footer>


	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
		
	</script>

	<!-- Chuông thông báo (chỉ khi đã đăng nhập) -->
	<th:block th:if="${session.user != null}"><th:block th:replace="~{fragments/notification-bell :: scripts}"></th:block></th:block>
</body>
</html>
