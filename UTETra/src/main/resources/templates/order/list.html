<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/user-layout :: main('Đơn hàng của tôi - UTETra', ~{::#orders-content})}">

<body>
	<div id="orders-content">
		<style>
.od-tabs { gap: .35rem; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: .25rem; }
.od-tabs .nav-link { color: #495057; white-space: nowrap; border-radius: 999px; background: #fff; border: 1px solid #dee2e6; }
.od-tabs .nav-link.active { background: #198754; border-color: #198754; color: #fff; }
.od-card { border: 0; border-radius: 1rem; box-shadow: 0 .125rem .5rem rgba(0, 0, 0, .06); }
		</style>

		<h1 class="h4 fw-bold text-success mb-3">
			<i class="bi bi-receipt me-2"></i>Đơn hàng của tôi
		</h1>

		<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
		<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

		<!-- Tab: Chờ xác nhận, Đang chuẩn bị, Đang giao, Hoàn thành, Đã huỷ (Trả hàng chỉ hiện khi có đơn) -->
		<ul class="nav od-tabs mb-3">
			<li class="nav-item" th:each="t : ${tabs}" th:if="${t.name() != 'RETURNED' or counts[t.name()] > 0 or t == tab}">
				<a class="nav-link" th:classappend="${t == tab} ? 'active'"
					th:href="@{/orders(tab=${t.name()})}">
					<span th:text="${t.label}">Tab</span>
					<span th:if="${counts[t.name()] > 0}" class="badge rounded-pill ms-1"
						th:classappend="${t == tab} ? 'text-bg-light' : 'text-bg-success'"
						th:text="${counts[t.name()]}">0</span>
				</a>
			</li>
		</ul>

		<!-- Không có đơn -->
		<div th:if="${#lists.isEmpty(orders)}" class="text-center py-5">
			<i class="bi bi-bag display-1 text-success opacity-50"></i>
			<p class="mt-3 text-muted">
				Chưa có đơn hàng nào ở mục <b th:text="${tab.label}"></b>
			</p>
			<a th:href="@{/menu}" class="btn btn-success px-4"><i class="bi bi-cup-hot me-1"></i> Đặt món ngay</a>
		</div>

		<!-- Danh sách đơn -->
		<div class="card od-card mb-3" th:each="o : ${orders}">
			<div class="card-body">
				<div class="d-flex justify-content-between align-items-start gap-2 mb-2">
					<div class="min-w-0">
						<div class="fw-semibold">
							<i class="bi bi-shop me-1 text-success"></i><span th:text="${o.branchName}"></span>
						</div>
						<div class="small text-muted">
							Đơn #<span th:text="${o.id}"></span> · <span th:text="${o.createdAt}"></span> ·
							<span th:text="${o.pickup} ? 'Đến lấy tại cửa hàng' : 'Giao tận nơi'"></span>
						</div>
					</div>
					<span class="badge" th:classappend="${o.badgeClass}" th:text="${o.status == 'CANCELLED'} ? (${o.cancelledBy == 'CUSTOMER'} ? 'Bạn đã huỷ' : (${o.cancelledBy == 'STORE'} ? 'Cửa hàng đã huỷ' : 'Đã huỷ')) : ${o.statusLabel}"></span>
				</div>

				<div class="border-top pt-2">
					<span th:text="${o.firstItem}"></span>
					<span th:if="${o.moreItems > 0}" class="text-muted" th:text="|và ${o.moreItems} món khác|"></span>
				</div>

				<div class="d-flex justify-content-between align-items-center mt-2 flex-wrap gap-2">
					<div class="small text-muted d-flex align-items-center gap-1 flex-wrap">
						<span th:text="${o.totalQty}"></span> ly · <span th:text="${o.payment.methodLabel}"></span>
						<span class="badge rounded-pill" th:unless="${o.payment.awaiting}" th:classappend="${o.payment.badgeClass}">
							<i class="bi me-1" th:classappend="${o.payment.icon}"></i><span th:text="${o.payment.badge}"></span></span>
					</div>
					<div>
						Tổng: <span class="fw-bold text-danger"
							th:text="|${#numbers.formatInteger(o.totalAmount, 1, 'POINT')}đ|"></span>
					</div>
				</div>

				<div class="d-flex justify-content-end gap-2 mt-3">
					<a th:if="${o.canCancel}" class="btn btn-sm btn-outline-danger"
						th:href="@{|/orders/${o.id}#huy-don|}">Huỷ đơn</a>
					<!-- Chờ thanh toán: trả tiếp trước khi hết hạn giữ đơn -->
					<a th:if="${o.status == 'AWAITING_PAYMENT'}" class="btn btn-sm btn-warning fw-semibold"
						th:href="@{/payment/{id}/result(id=${o.id})}"><i class="bi bi-credit-card me-1"></i>Thanh toán ngay
						<span class="od-count" th:attr="data-deadline=${o.payment.payDeadlineMillis}"></span></a>
					<!-- Đã giao: Mua lại / Đánh giá / Xem chi tiết; Đã huỷ: Mua lại / Xem chi tiết; Trả hàng: Xem chi tiết -->
					<form th:if="${o.status == 'DELIVERED' or o.status == 'CANCELLED'}" method="post"
						th:action="@{/orders/{id}/reorder(id=${o.id})}" class="d-inline">
						<button type="submit" class="btn btn-sm btn-success"><i class="bi bi-arrow-repeat me-1"></i>Mua lại</button>
					</form>
					<a th:if="${o.status == 'DELIVERED' and o.toReview > 0}" class="btn btn-sm btn-warning fw-semibold"
						th:href="@{/orders/{id}/review(id=${o.id})}"><i class="bi bi-star me-1"></i>
						<span th:text="|Đánh giá (${o.toReview} món)|">Đánh giá</span></a>
					<a th:if="${o.status == 'DELIVERED' and o.toReview == 0}" class="btn btn-sm btn-outline-secondary"
						th:href="@{/orders/{id}/review(id=${o.id})}"><i class="bi bi-star me-1"></i>Xem đánh giá</a>
					<a th:if="${o.status == 'PENDING' or o.status == 'CONFIRMED' or o.status == 'READY' or o.status == 'PICKED_UP' or o.status == 'DELIVERING'}"
						class="btn btn-sm btn-outline-success" th:href="@{/orders/{id}/tracking(id=${o.id})}">
						<i class="bi bi-geo-alt me-1"></i>Theo dõi đơn</a>
					<a class="btn btn-sm btn-outline-success" th:href="@{/orders/{id}(id=${o.id})}">Xem chi tiết</a>
				</div>
			</div>
		</div>

		<!-- Bước 7: quán đổi trạng thái thì trang tự cập nhật -->
		<div data-live-orders data-order-id="0"></div>
		<script th:src="@{/js/live-socket.js}"></script>
		<script th:src="@{/js/order-live.js}"></script>
		<script>
			// Đếm ngược hạn thanh toán trên nút "Thanh toán ngay"
			(function () {
				const els = document.querySelectorAll('.od-count[data-deadline]');
				if (!els.length) return;
				const tick = () => els.forEach((el) => {
					const left = Math.max(0, Number(el.dataset.deadline) - Date.now());
					el.textContent = left > 0 ? '(' + String(Math.floor(left / 60000)).padStart(2, '0') + ':'
						+ String(Math.floor(left % 60000 / 1000)).padStart(2, '0') + ')' : '(hết hạn)';
				});
				tick();
				setInterval(tick, 1000);
			})();
		</script>
	</div>
</body>
</html>
