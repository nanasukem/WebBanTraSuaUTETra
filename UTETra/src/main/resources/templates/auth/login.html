<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - UTETra</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
	<div class="container" style="max-width: 420px;">
		<div class="card shadow-sm border-0 rounded-4 p-4">
			<div class="text-center mb-3">
				<h2 class="fw-bold text-success">🍃 UTETra</h2>
				<p class="text-muted small">Đăng nhập tài khoản để trải nghiệm</p>
			</div>

			<div th:if="${error}"
				class="alert alert-danger py-2 small text-center" th:text="${error}"></div>
			<div th:if="${success}"
				class="alert alert-success py-2 small text-center"
				th:text="${success}"></div>

			<form th:action="@{/auth/login}" method="post"
				th:object="${loginRequest}">
				<div class="mb-3">
					<label class="form-label fw-semibold">Tên đăng nhập</label> <input
						type="text" class="form-control" th:field="*{username}" required
						placeholder="Nhập username">
				</div>
				<div class="mb-3">
					<label class="form-label fw-semibold">Mật khẩu</label> <input
						type="password" class="form-control" th:field="*{password}"
						required placeholder="Mật khẩu">
				</div>
				<button type="submit"
					class="btn btn-success w-100 rounded-pill py-2 fw-bold mt-2">Đăng
					nhập</button>
			</form>

			<div class="text-center mt-4">
				<small class="text-muted">Chưa có tài khoản? <a
					th:href="@{/auth/register}"
					class="text-success fw-bold text-decoration-none">Đăng ký ngay</a></small>
			</div>
		</div>
	</div>
</body>
</html>
