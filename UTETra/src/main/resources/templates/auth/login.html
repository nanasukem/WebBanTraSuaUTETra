<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - UTETra</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	background-color: #f8f9fa;
}

.auth-card {
	max-width: 420px;
	border-radius: 1rem;
	border: none;
}

.btn-success {
	background-color: #198754;
	border: none;
}
</style>
</head>
<body class="d-flex align-items-center vh-100">
	<div class="container">
		<div class="card auth-card shadow-sm mx-auto p-4">
			<div class="text-center mb-4">
				<h3 class="fw-bold text-success">🍃 UTETra</h3>
				<p class="text-muted small">Đăng nhập tài khoản của bạn</p>
			</div>

			<!-- Thông báo thành công -->
			<div th:if="${success}" class="alert alert-success py-2 small"
				th:text="${success}"></div>
			<div th:if="${param.logout}" class="alert alert-info py-2 small">Bạn
				đã đăng xuất thành công!</div>

			<!-- Thông báo lỗi -->
			<div th:if="${error}" class="alert alert-danger py-2 small"
				th:text="${error}"></div>

			<form th:action="@{/auth/login}" th:object="${loginRequest}"
				method="post">
				<div class="mb-3 text-start">
					<label class="form-label small fw-bold">Tên đăng nhập</label> <input
						type="text" th:field="*{username}" class="form-control"
						placeholder="Nhập tên đăng nhập" required autofocus>
				</div>
				<div class="mb-3 text-start">
					<div class="d-flex justify-content-between align-items-center">
						<label class="form-label small fw-bold mb-0">Mật khẩu</label> <a
							th:href="@{/auth/forgot-password}"
							class="text-decoration-none small text-success">Quên mật
							khẩu?</a>
					</div>
					<input type="password" th:field="*{password}"
						class="form-control mt-1" placeholder="••••••••" required>
				</div>
				<button type="submit"
					class="btn btn-success w-100 rounded-pill py-2 fw-bold mt-2">Đăng
					nhập</button>
			</form>

			<div class="text-center mt-4">
				<p class="small text-muted mb-0">
					Chưa có tài khoản? <a th:href="@{/auth/register}"
						class="text-success fw-bold text-decoration-none">Đăng ký ngay</a>
				</p>
			</div>
		</div>
	</div>
</body>
</html>
