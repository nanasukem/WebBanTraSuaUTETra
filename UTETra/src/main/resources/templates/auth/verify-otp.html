<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/auth-layout :: main('Xác thực OTP - UTETra', ~{::#verify-otp-content})}">

<body>
	<div id="verify-otp-content" class="container">

		<div class="card auth-card shadow-sm mx-auto p-4 text-center">

			<h4 class="fw-bold text-success mb-2">
				<i class="bi bi-shield-check me-1"></i> Xác thực OTP
			</h4>

			<p class="text-muted small mb-3">
				Mã OTP xác thực đã được gửi đến email: <br> <b
					class="text-dark" th:text="${email}">email@example.com</b>
			</p>

			<div th:if="${success != null}"
				class="alert alert-success py-2 small" th:text="${success}"></div>

			<div th:if="${error != null}" class="alert alert-danger py-2 small"
				th:text="${error}"></div>

			<form th:action="@{/auth/verify-otp}" method="post">

				<input type="hidden" name="email" th:value="${email}">

				<div class="mb-3">
					<label for="code" class="form-label small fw-bold"> Mã OTP
						gồm 6 chữ số </label> <input type="text" id="code" name="code"
						class="form-control otp-input fw-bold" maxlength="6" minlength="6"
						pattern="[0-9]{6}" inputmode="numeric"
						autocomplete="one-time-code" title="Mã OTP gồm 6 chữ số"
						placeholder="______" required autofocus>
				</div>

				<button type="submit"
					class="btn btn-success w-100 rounded-pill py-2 fw-bold">
					<i class="bi bi-check-circle me-1"></i> Xác nhận OTP
				</button>

			</form>

			<form th:action="@{/auth/resend-otp}" method="post" class="mt-3">

				<input type="hidden" name="email" th:value="${email}"> <span
					class="small text-muted"> Không nhận được mã? </span>

				<button type="submit"
					class="btn btn-link btn-sm p-0 align-baseline text-success fw-semibold text-decoration-none">
					Gửi lại mã</button>

			</form>

			<div class="mt-3">
				<a th:href="@{/auth/login}"
					class="text-decoration-none small text-muted"> <i
					class="bi bi-arrow-left me-1"></i> Quay lại đăng nhập
				</a>
			</div>

		</div>

	</div>
</body>
</html>
