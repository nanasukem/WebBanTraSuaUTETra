<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Xác thực OTP - UTETra</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
	<div class="container" style="max-width: 420px;">
		<div class="card shadow-sm border-0 rounded-4 p-4 text-center">
			<h3 class="fw-bold text-success mb-2">🍃 Nhập Mã OTP</h3>
			<p class="text-muted small mb-3">
				Mã OTP xác thực đã được gửi đến email: <br>
				<b th:text="${email}"></b>
			</p>

			<div th:if="${error}" class="alert alert-danger py-2 small"
				th:text="${error}"></div>

			<form th:action="@{/auth/verify-otp}" method="post">
				<input type="hidden" name="email" th:value="${email}" />
				<div class="mb-3">
					<input type="text" name="code"
						class="form-control text-center fs-4 fw-bold" maxlength="6"
						placeholder="______" required autofocus>
				</div>
				<button type="submit"
					class="btn btn-success w-100 rounded-pill py-2 fw-bold">Xác
					nhận OTP</button>
			</form>
		</div>
	</div>
</body>
</html>
