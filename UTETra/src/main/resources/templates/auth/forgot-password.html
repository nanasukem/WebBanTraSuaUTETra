<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quên mật khẩu - UTETra</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	background-color: #f8f9fa;
}

.auth-card {
	max-width: 420px;
	border-radius: 1rem;
	border: none;
}
</style>
</head>
<body class="d-flex align-items-center vh-100">
	<div class="container">
		<div class="card auth-card shadow-sm mx-auto p-4 text-center">
			<h3 class="fw-bold text-success mb-2">🍃 Quên Mật Khẩu</h3>
			<p class="text-muted small mb-3">Nhập email của bạn để nhận mã
				OTP khôi phục.</p>

			<div th:if="${error}" class="alert alert-danger py-2 small"
				th:text="${error}"></div>

			<form th:action="@{/auth/forgot-password}" method="post">
				<div class="mb-3 text-start">
					<label class="form-label small fw-bold">Email tài khoản</label> <input
						type="email" name="email" class="form-control"
						placeholder="nguyenvana@gmail.com" required autofocus>
				</div>
				<button type="submit"
					class="btn btn-success w-100 rounded-pill py-2 fw-bold">Gửi
					mã OTP</button>
			</form>

			<div class="mt-3">
				<a th:href="@{/auth/login}"
					class="text-decoration-none small text-muted">Quay lại Đăng
					nhập</a>
			</div>
		</div>
	</div>
</body>
</html>
