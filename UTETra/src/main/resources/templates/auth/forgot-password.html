<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/auth-layout :: main('Quên mật khẩu - UTETra', ~{::#forgot-password-content})}">

<body>
	<div id="forgot-password-content" class="container">

		<div class="card auth-card shadow-sm mx-auto p-4 text-center">

			<!-- TIÊU ĐỀ -->
			<h4 class="fw-bold text-success mb-2">
				<i class="bi bi-key-fill me-1"></i> Quên mật khẩu
			</h4>

			<p class="text-muted small mb-3">Nhập email đã đăng ký tài khoản
				để nhận mã OTP khôi phục mật khẩu.</p>

			<!-- THÔNG BÁO LỖI -->
			<div th:if="${error != null}" class="alert alert-danger py-2 small"
				th:text="${error}"></div>

			<!-- THÔNG BÁO THÀNH CÔNG -->
			<div th:if="${message != null}"
				class="alert alert-success py-2 small" th:text="${message}"></div>

			<!-- FORM GỬI OTP QUÊN MẬT KHẨU -->
			<form th:action="@{/auth/forgot-password}" method="post">

				<div class="mb-3 text-start">

					<label for="email" class="form-label small fw-bold"> Email
						tài khoản (*) </label> <input type="email" id="email" name="email"
						class="form-control" placeholder="nguyenvana@gmail.com"
						autocomplete="email" required autofocus>

				</div>

				<button type="submit"
					class="btn btn-success w-100 rounded-pill py-2 fw-bold mt-2">
					<i class="bi bi-envelope me-1"></i> Gửi mã OTP
				</button>

			</form>

			<!-- QUAY LẠI ĐĂNG NHẬP -->
			<div class="mt-3">
				<a th:href="@{/auth/login}"
					class="text-decoration-none small text-muted"> <i
					class="bi bi-arrow-left me-1"></i> Quay lại đăng nhập
				</a>
			</div>

		</div>

	</div>
</body>
</html>
