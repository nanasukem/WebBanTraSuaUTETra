<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt lại mật khẩu - UTETra</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	background-color: #f8f9fa;
}

.auth-card {
	max-width: 420px;
	border-radius: 1rem;
	border: none;
}

.otp-input {
	letter-spacing: 8px;
	font-size: 1.5rem;
	text-align: center;
}
</style>
</head>
<body class="d-flex align-items-center vh-100">
	<div class="container">
		<div class="card auth-card shadow-sm mx-auto p-4 text-center">
			<h3 class="fw-bold text-success mb-2">🍃 Đặt Mật Khẩu Mới</h3>
			<p class="text-muted small mb-3">
				Nhập mã OTP vừa gửi tới <b class="text-dark" th:text="${email}"></b>
			</p>

			<div th:if="${error}" class="alert alert-danger py-2 small"
				th:text="${error}"></div>

			<form th:action="@{/auth/reset-password}" method="post">
				<input type="hidden" name="email" th:value="${email}" />
				<div class="mb-3 text-start">
					<label class="form-label small fw-bold">Mã OTP (6 số)</label> <input
						type="text" name="code" class="form-control otp-input fw-bold"
						maxlength="6" placeholder="______" required autofocus>
				</div>
				<div class="mb-3 text-start">
					<label class="form-label small fw-bold">Mật khẩu mới</label> <input
						type="password" name="newPassword" class="form-control"
						placeholder="••••••••" required>
				</div>
				<button type="submit"
					class="btn btn-success w-100 rounded-pill py-2 fw-bold">Xác
					nhận đổi mật khẩu</button>
			</form>

			<div class="mt-3">
				<a th:href="@{/auth/login}"
					class="text-decoration-none small text-muted">Hủy bỏ</a>
			</div>
		</div>
	</div>
</body>
</html>
