<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/auth-layout :: main('Đặt lại mật khẩu - UTETra', ~{::#reset-password-content})}">

<body>
	<div id="reset-password-content" class="container">

		<div class="card auth-card shadow-sm mx-auto p-4 text-center">

			<h4 class="fw-bold text-success mb-2">
				<i class="bi bi-shield-lock-fill me-1"></i> Đặt mật khẩu mới
			</h4>

			<p class="text-muted small mb-3">
				Nhập mã OTP vừa gửi tới <b class="text-dark" th:text="${email}">email@example.com</b>
			</p>

			<div th:if="${error != null}" class="alert alert-danger py-2 small"
				th:text="${error}"></div>

			<div th:if="${message != null}"
				class="alert alert-success py-2 small" th:text="${message}"></div>

			<form th:action="@{/auth/reset-password}" method="post">

				<input type="hidden" name="email" th:value="${email}">

				<div class="mb-3 text-start">
					<label for="code" class="form-label small fw-bold"> Mã OTP
						(6 số) </label> <input type="text" id="code" name="code"
						class="form-control otp-input fw-bold" inputmode="numeric"
						pattern="[0-9]{6}" maxlength="6" minlength="6"
						placeholder="______" autocomplete="one-time-code" required
						autofocus>
				</div>

				<div class="mb-3 text-start">
					<label for="newPassword" class="form-label small fw-bold">
						Mật khẩu mới </label> <input type="password" id="newPassword"
						name="newPassword" class="form-control"
						placeholder="Nhập mật khẩu mới" autocomplete="new-password"
						minlength="6" maxlength="72" required>
				</div>

				<button type="submit"
					class="btn btn-success w-100 rounded-pill py-2 fw-bold mt-2">
					<i class="bi bi-check-circle me-1"></i> Xác nhận đổi mật khẩu
				</button>

			</form>

			<div class="mt-3">
				<a th:href="@{/auth/login}"
					class="text-decoration-none small text-muted"> <i
					class="bi bi-arrow-left me-1"></i> Hủy bỏ
				</a>
			</div>

		</div>

	</div>
</body>
</html>
