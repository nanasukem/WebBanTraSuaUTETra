<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký - UTETra</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center my-5">
	<div class="container" style="max-width: 480px;">
		<div class="card shadow-sm border-0 rounded-4 p-4">
			<div class="text-center mb-3">
				<h2 class="fw-bold text-success">🍃 UTETra</h2>
				<p class="text-muted small">Tạo tài khoản mới</p>
			</div>

			<div th:if="${error}"
				class="alert alert-danger py-2 small text-center" th:text="${error}"></div>

			<form th:action="@{/auth/register}" method="post"
				th:object="${registerRequest}">
				<div class="mb-3">
					<label class="form-label fw-semibold">Tên đăng nhập (*)</label> <input
						type="text" class="form-control" th:field="*{username}" required
						placeholder="Ví dụ: user123">
				</div>
				<div class="mb-3">
					<label class="form-label fw-semibold">Mật khẩu (*)</label> <input
						type="password" class="form-control" th:field="*{password}"
						required placeholder="Mật khẩu">
				</div>
				<div class="mb-3">
					<label class="form-label fw-semibold">Họ và tên</label> <input
						type="text" class="form-control" th:field="*{fullName}"
						placeholder="Nguyễn Văn A">
				</div>
				<div class="mb-3">
					<label class="form-label fw-semibold">Email (*)</label> <input
						type="email" class="form-control" th:field="*{email}" required
						placeholder="name@example.com">
				</div>
				<div class="mb-3">
					<label class="form-label fw-semibold">Số điện thoại</label> <input
						type="text" class="form-control" th:field="*{phone}"
						placeholder="0901234567">
				</div>
				<button type="submit"
					class="btn btn-success w-100 rounded-pill py-2 fw-bold mt-2">Đăng
					ký tài khoản</button>
			</form>

			<div class="text-center mt-4">
				<small class="text-muted">Đã có tài khoản? <a
					th:href="@{/auth/login}"
					class="text-success fw-bold text-decoration-none">Đăng nhập</a></small>
			</div>
		</div>
	</div>
</body>
</html>
