<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/auth-layout :: main('Đăng ký - UTETra', ~{::#register-content})}">

<body>
	<div id="register-content" class="container">

		<div class="card auth-card shadow-sm mx-auto p-4">

			<div class="text-center mb-3">
				<h4 class="fw-bold text-success mb-1">Tạo tài khoản mới</h4>
				<p class="text-muted small mb-0">Mã OTP kích hoạt sẽ được gửi
					qua email</p>
			</div>

			<div th:if="${error != null}"
				class="alert alert-danger py-2 small text-center" th:text="${error}">
			</div>

			<form th:action="@{/auth/register}" method="post"
				th:object="${registerRequest}">

				<div class="mb-3">
					<label for="username" class="form-label small fw-bold"> Tên
						đăng nhập (*) </label> <input type="text" id="username"
						class="form-control" th:field="*{username}"
						autocomplete="username" required placeholder="Ví dụ: user123"
						autofocus>
				</div>

				<div class="mb-3">
					<label for="password" class="form-label small fw-bold"> Mật
						khẩu (*) </label> <input type="password" id="password"
						class="form-control" th:field="*{password}"
						autocomplete="new-password" required placeholder="Nhập mật khẩu">
				</div>

				<div class="mb-3">
					<label for="fullName" class="form-label small fw-bold"> Họ
						và tên </label> <input type="text" id="fullName" class="form-control"
						th:field="*{fullName}" autocomplete="name"
						placeholder="Nguyễn Văn A">
				</div>

				<div class="mb-3">
					<label for="email" class="form-label small fw-bold"> Email
						(*) </label> <input type="email" id="email" class="form-control"
						th:field="*{email}" autocomplete="email" required
						placeholder="name@example.com">
				</div>

				<div class="mb-3">
					<label for="phone" class="form-label small fw-bold"> Số
						điện thoại </label> <input type="tel" id="phone" class="form-control"
						th:field="*{phone}" autocomplete="tel" placeholder="0901234567">
				</div>

				<button type="submit"
					class="btn btn-success w-100 rounded-pill py-2 fw-bold mt-2">
					<i class="bi bi-person-plus-fill me-1"></i> Đăng ký tài khoản
				</button>

			</form>

			<div class="text-center mt-4">
				<p class="small text-muted mb-0">
					Đã có tài khoản? <a th:href="@{/auth/login}"
						class="text-success fw-bold text-decoration-none"> Đăng nhập </a>
				</p>
			</div>

		</div>

	</div>
</body>
</html>
