<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/user-layout :: main('Giỏ hàng - UTETra', ~{::#cart-content})}">

<body>
	<div id="cart-content">

		<a th:href="@{/menu#thuc-don}"
			class="text-decoration-none text-success small"> <i
			class="bi bi-arrow-left"></i> Tiếp tục chọn món
		</a>
		<h1 class="h4 fw-bold text-success mt-2 mb-3">
			<i class="bi bi-cart3 me-2"></i>Giỏ hàng của bạn
		</h1>

		<div th:if="${success}" class="alert alert-success alert-dismissible fade show">
			<i class="bi bi-check-circle me-1"></i><span th:text="${success}"></span>
			<ul th:if="${reorderNotes}" class="small mb-0 mt-1">
				<li th:each="n : ${reorderNotes}" th:text="${n}"></li>
			</ul>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
			<span th:text="${error}"></span>
			<ul th:if="${reorderNotes}" class="small mb-0 mt-1">
				<li th:each="n : ${reorderNotes}" th:text="${n}"></li>
			</ul>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<div id="cart-empty" class="text-center py-5 d-none">
			<i class="bi bi-cup-straw display-1 text-success opacity-50"></i>
			<p class="mt-3 text-muted">Giỏ hàng đang trống</p>
			<a th:href="@{/menu#thuc-don}" class="btn btn-success px-4"> <i
				class="bi bi-cup-hot me-1"></i> Xem thực đơn
			</a>
		</div>

		<div id="cart-page" class="row g-4">
			<div class="col-lg-8" id="cart-items">
				<div class="text-center text-muted py-5">Đang tải giỏ hàng...</div>
			</div>

			<div class="col-lg-4">
				<div class="card border-0 shadow-sm rounded-4 position-sticky"
					style="top: 90px">
					<div class="card-body">
						<h2 class="h6 fw-bold text-success mb-3">Tóm tắt đơn hàng</h2>
						<div class="d-flex justify-content-between mb-2">
							<span>Số ly</span><span id="cart-total-qty">0</span>
						</div>
						<div class="d-flex justify-content-between mb-2">
							<span>Tạm tính</span><span class="fw-bold text-danger"
								id="cart-subtotal">0đ</span>
						</div>
						<p class="small text-muted mb-3">Chi nhánh làm món, phí ship
							và mã giảm giá được chọn ở bước thanh toán.</p>
						<div class="d-grid gap-2">
							<a th:href="@{/checkout}" class="btn btn-success fw-bold"
								id="btn-checkout"> <i class="bi bi-bag-check me-1"></i> Tiến
								hành đặt hàng
							</a>
							<button type="button" class="btn btn-outline-danger btn-sm"
								id="btn-clear-cart">
								<i class="bi bi-trash"></i> Xoá toàn bộ giỏ
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div th:replace="~{fragments/product-modal :: productModal}"></div>
	</div>
</body>
</html>
