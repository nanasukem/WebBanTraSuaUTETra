<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giỏ hàng - UTETra</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">
	<!-- Header chung cần có badge: <span id="cart-count" class="badge text-bg-danger">0</span> -->

	<main class="container py-4">
		<h1 class="h4 mb-3">
			<i class="bi bi-cart3 me-2"></i>Giỏ hàng của bạn
		</h1>

		<!-- Giỏ trống -->
		<div id="cart-empty" class="text-center py-5 d-none">
			<i class="bi bi-cup-straw display-1 text-muted"></i>
			<p class="mt-3 text-muted">Giỏ hàng đang trống</p>
			<a th:href="@{/menu}" class="btn btn-primary">Xem thực đơn</a>
		</div>

		<div id="cart-page" class="row g-4">
			<!-- Danh sách món, nhóm theo shop: cart.js vẽ vào đây -->
			<div class="col-lg-8" id="cart-items"></div>

			<!-- Tóm tắt -->
			<div class="col-lg-4">
				<div class="card position-sticky" style="top: 1rem">
					<div class="card-body">
						<h2 class="h6 fw-semibold mb-3">Tóm tắt đơn hàng</h2>
						<div class="d-flex justify-content-between mb-2">
							<span>Số ly</span><span id="cart-total-qty">0</span>
						</div>
						<div class="d-flex justify-content-between mb-2">
							<span>Tạm tính</span><span id="cart-subtotal">0đ</span>
						</div>
						<p class="small text-muted mb-3">Phí ship và mã giảm giá được
							tính ở bước thanh toán. Món từ nhiều shop sẽ được tách thành
							nhiều đơn.</p>
						<div class="d-grid gap-2">
							<a th:href="@{/checkout}" class="btn btn-primary"
								id="btn-checkout">Tiến hành đặt hàng</a>
							<button type="button" class="btn btn-outline-danger btn-sm"
								id="btn-clear-cart">
								<i class="bi bi-trash"></i> Xoá toàn bộ giỏ
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/cart.js}"></script>
</body>
</html>
