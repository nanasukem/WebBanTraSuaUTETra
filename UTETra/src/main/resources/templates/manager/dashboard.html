<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/admin-layout :: main('Dashboard quản lý', 'dashboard', ~{::#admin-content})}">

<section id="admin-content">

	<!-- Tiêu đề trang -->
	<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
		<div>
			<h2 class="fw-bold mb-1">
				<i class="bi bi-speedometer2 me-2"></i>
				Tổng quan hệ thống
			</h2>
			<p class="text-muted mb-0">
				Theo dõi tình hình hoạt động của toàn hệ thống.
			</p>
		</div>

		<div class="text-muted small">
			<i class="bi bi-calendar3 me-1"></i>
			<span th:text="${#temporals.format(
                T(java.time.LocalDateTime).now(),
                'dd/MM/yyyy'
            )}">21/10/2026</span>
		</div>
	</div>

	<!-- Thông báo thành công -->
	<div th:if="${success != null}" class="alert alert-success alert-dismissible fade show" role="alert">
		<i class="bi bi-check-circle-fill me-2"></i>
		<span th:text="${success}">Thao tác thành công.</span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
	</div>

	<!-- Thông báo lỗi -->
	<div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
		<i class="bi bi-exclamation-triangle-fill me-2"></i>
		<span th:text="${error}">Đã xảy ra lỗi.</span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
	</div>

	<!-- TỔNG QUAN CHI NHÁNH -->
	<div class="mb-4">
		<h5 class="fw-bold mb-3">
			<i class="bi bi-shop me-2"></i>
			Tổng quan chi nhánh
		</h5>

		<div class="row g-3">

			<!-- Tổng số chi nhánh -->
			<div class="col-12 col-sm-6 col-xl-3">
				<a th:href="@{/manager/branches}" class="text-decoration-none">
					<div class="card dashboard-card border-0 shadow-sm h-100">
						<div class="card-body d-flex align-items-center justify-content-between">
							<div>
								<p class="text-muted mb-2">Tổng chi nhánh</p>
								<h3 class="fw-bold mb-0" th:text="${totalBranches}">0</h3>
							</div>
							<div class="stat-icon bg-primary-subtle text-primary">
								<i class="bi bi-shop"></i>
							</div>
						</div>
						<div class="card-footer bg-white border-0 pt-0">
							<span class="small text-primary">
								Xem danh sách
								<i class="bi bi-arrow-right"></i>
							</span>
						</div>
					</div>
				</a>
			</div>

			<!-- Chi nhánh chờ duyệt -->
			<div class="col-12 col-sm-6 col-xl-3">
				<a th:href="@{/manager/branches}" class="text-decoration-none">
					<div class="card dashboard-card border-0 shadow-sm h-100">
						<div class="card-body d-flex align-items-center justify-content-between">
							<div>
								<p class="text-muted mb-2">Chờ duyệt</p>
								<h3 class="fw-bold mb-0" th:text="${pendingBranches}">0</h3>
							</div>
							<div class="stat-icon bg-warning-subtle text-warning">
								<i class="bi bi-hourglass-split"></i>
							</div>
						</div>
						<div class="card-footer bg-white border-0 pt-0">
							<span class="small text-warning">
								Kiểm tra chi nhánh
								<i class="bi bi-arrow-right"></i>
							</span>
						</div>
					</div>
				</a>
			</div>

			<!-- Chi nhánh đã duyệt -->
			<div class="col-12 col-sm-6 col-xl-3">
				<a th:href="@{/manager/branches}" class="text-decoration-none">
					<div class="card dashboard-card border-0 shadow-sm h-100">
						<div class="card-body d-flex align-items-center justify-content-between">
							<div>
								<p class="text-muted mb-2">Đã duyệt</p>
								<h3 class="fw-bold mb-0" th:text="${approvedBranches}">0</h3>
							</div>
							<div class="stat-icon bg-success-subtle text-success">
								<i class="bi bi-check-circle"></i>
							</div>
						</div>
						<div class="card-footer bg-white border-0 pt-0">
							<span class="small text-success">
								Xem chi nhánh
								<i class="bi bi-arrow-right"></i>
							</span>
						</div>
					</div>
				</a>
			</div>

			<!-- Chi nhánh tạm ngưng -->
			<div class="col-12 col-sm-6 col-xl-3">
				<a th:href="@{/manager/branches}" class="text-decoration-none">
					<div class="card dashboard-card border-0 shadow-sm h-100">
						<div class="card-body d-flex align-items-center justify-content-between">
							<div>
								<p class="text-muted mb-2">Tạm ngưng</p>
								<h3 class="fw-bold mb-0" th:text="${suspendedBranches}">0</h3>
							</div>
							<div class="stat-icon bg-danger-subtle text-danger">
								<i class="bi bi-pause-circle"></i>
							</div>
						</div>
						<div class="card-footer bg-white border-0 pt-0">
							<span class="small text-danger">
								Xem chi nhánh
								<i class="bi bi-arrow-right"></i>
							</span>
						</div>
					</div>
				</a>
			</div>

		</div>
	</div>

</section>

</html>
